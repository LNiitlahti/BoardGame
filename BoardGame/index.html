<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Game - Loading...</title>

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
  <link rel="manifest" href="images/favicon/site.webmanifest">
  <link rel="shortcut icon" href="images/favicon/favicon.ico">

  <link rel="stylesheet" href="css/slate-theme.css">
  <link rel="stylesheet" href="css/auth-modern.css">
  <script src="scripts/firebase-loader.js"></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-logo-section">
      <div class="auth-logo">🎮</div>
      <h1 class="auth-logo-title">Board Game</h1>
      <div class="loading-spinner" style="margin: 2rem auto; width: 3rem; height: 3rem; border-width: 4px;"></div>
      <p class="auth-logo-subtitle" id="status-text">Authenticating...</p>
    </div>
  </div>

  <script type="module">
    /**
     * ===========================
     * SMART ROUTER / ENTRY POINT
     * ===========================
     * This page determines where to redirect the user based on:
     * 1. Authentication status (logged in or not)
     * 2. User role (superadmin/god, admin, team member, regular user)
     * 3. User profile completeness
     *
     * ROUTING LOGIC:
     * - Not logged in → login.html
     * - Logged in as GOD (superadmin) → home.html (with god mode UI)
     * - Logged in as admin → home.html (with admin UI)
     * - Logged in as team member → home.html (with player UI)
     * - Logged in but no profile → setup.html
     */

    let auth;
    let db;

    // Wait for Firebase to be ready
    document.addEventListener('firebase-ready', function() {
      console.log('[Router] Firebase ready, checking authentication...');

      auth = firebase.auth();
      db = firebase.firestore();

      // Monitor auth state
      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          // Not logged in → redirect to login
          console.log('[Router] No user logged in, redirecting to login...');
          updateStatus('Redirecting to login...');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 500);
          return;
        }

        console.log('[Router] User logged in:', user.uid);
        updateStatus('Loading your profile...');

        try {
          // Load user profile from Firestore
          const userDoc = await db.collection('users').doc(user.uid).get();

          if (!userDoc.exists) {
            // No profile yet → redirect to setup
            console.log('[Router] No profile found, redirecting to setup...');
            updateStatus('Setting up your profile...');
            setTimeout(() => {
              window.location.href = 'setup.html';
            }, 500);
            return;
          }

          const userData = userDoc.data();
          console.log('[Router] User profile loaded:', userData);

          // Note: All users (including those assigned to teams) go to development landing page
          // The development landing page will show appropriate navigation options

          // Determine user role
          const role = determineUserRole(userData, user.uid);
          console.log('[Router] User role:', role);

          // Store role in sessionStorage for quick access
          sessionStorage.setItem('userRole', role);
          sessionStorage.setItem('userProfile', JSON.stringify(userData));

          // Route based on role
          routeUser(role, userData);

        } catch (error) {
          console.error('[Router] Error loading profile:', error);
          updateStatus('Error loading profile...');

          // On error, default to app page (it will handle the error)
          setTimeout(() => {
            window.location.href = 'app.html';
          }, 1000);
        }
      });
    });

    /**
     * Determine user role based on profile data
     * @param {Object} userData - User profile data from Firestore
     * @param {string} uid - User ID
     * @returns {string} Role: 'god', 'admin', 'player', or 'user'
     */
    function determineUserRole(userData, uid) {
      // Check for GOD (highest privilege)
      // Role determined by Firestore user profile only
      if (userData.isGod === true) {
        return 'god';
      }

      // Check for Admin
      if (userData.isAdmin === true) {
        return 'admin';
      }

      // Check for Player (has team or isPlayer flag)
      if (userData.isPlayer === true || userData.teamId) {
        return 'player';
      }

      // Default: Regular user
      return 'user';
    }

    /**
     * Route user to appropriate page based on role
     * @param {string} role - User role
     * @param {Object} userData - User profile data
     */
    function routeUser(role, userData) {
      updateStatus(`Welcome, ${userData.displayName || 'User'}!`);

      // All users go to development landing page first (software under development)
      updateStatus('Loading...');
      setTimeout(() => window.location.href = 'development-landing-page.html', 500);
    }

    /**
     * Update status message
     * @param {string} message - Status message to display
     */
    function updateStatus(message) {
      const statusEl = document.getElementById('status-text');
      if (statusEl) {
        statusEl.textContent = message;
      }
    }

    // Handle errors
    window.addEventListener('error', (event) => {
      console.error('[Router] Error:', event.error);
      updateStatus('An error occurred. Redirecting to login...');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    });
  </script>
</body>
</html>
