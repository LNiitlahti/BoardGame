<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Board Game - Music Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #10131c; min-height: 100vh; font-family: system-ui, sans-serif;
            color: #cdd; padding: 20px;
        }
        h1 { color: #fff; font-size: 1.2rem; margin-bottom: 14px; }
        .panel {
            background: rgba(44, 62, 80, 0.95); border-radius: 8px;
            padding: 14px; margin-bottom: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .tune-row {
            display: flex; align-items: center; gap: 8px;
            padding: 4px 8px; background: #1e2a38; border-radius: 4px; margin-bottom: 4px;
        }
        .tune-row label { color: #cdd; font-size: 0.8rem; min-width: 200px; }
        .tune-row input[type="range"] { flex: 1; }
        .tune-row .tune-value { color: #fff; font-size: 0.8rem; width: 60px; text-align: right; }
        button {
            background: #27ae60; color: #fff; border: none;
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
        }
        button:hover { filter: brightness(1.1); }
        canvas { display: block; background: #1e2a38; border-radius: 4px; }
        audio { width: 100%; margin-top: 10px; }
        .stem-panel {
            background: rgba(44, 62, 80, 0.95); border-radius: 8px;
            margin-bottom: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .stem-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; cursor: pointer; user-select: none;
        }
        .stem-header:hover { background: rgba(255,255,255,0.05); }
        .stem-header .stem-title { color: #fff; font-weight: 600; }
        .stem-header .stem-summary { color: #9fd; font-size: 0.8rem; }
        .stem-body { display: none; padding: 0 14px 14px; }
        .stem-panel.expanded .stem-body { display: block; }
        .stem-canvas-host { width: 100%; overflow-x: auto; position: relative; }
        .stem-canvas-host canvas.playhead {
            position: absolute; left: 0; top: 0; pointer-events: none;
        }
        .unrecognized-status { font-size: 0.8rem; color: #f7ba32; margin-top: 8px; }
        .stem-error { color: #f77; font-size: 0.85rem; padding: 10px 0; }
    </style>
</head>
<body>
    <h1>Music Analyzer &mdash; beat/envelope extraction for music-cues.json</h1>

    <div class="panel">
        <input type="file" id="fileInput" accept="audio/*" multiple>
        <button id="btnDownloadAll" style="margin-top:8px;">Download all music-cues-*.json</button>
        <div id="unrecognizedStatus" class="unrecognized-status"></div>
    </div>

    <div id="stemPanels"></div>

    <script>
        const STEM_DEFS = [
            { key: 'vocals',        label: 'Vocals',         match: /vocals(?!.*backing)/i },
            { key: 'backingVocals', label: 'Backing Vocals', match: /backing.*vocals/i },
            { key: 'drums',         label: 'Drums',          match: /drums/i },
            { key: 'bass',          label: 'Bass',           match: /bass/i },
            { key: 'percussion',    label: 'Percussion',     match: /percussion/i },
            { key: 'strings',       label: 'Strings',        match: /strings/i },
            { key: 'synth',         label: 'Synth',          match: /synth/i },
            { key: 'other',         label: 'Other',          match: /other/i },
        ];

        // One entry per matched stem, created lazily on first match.
        // Shape: { key, label, envelope, durationMs, beats, threshold,
        //          debounce, objectUrl, els: { panel, header, summary, body,
        //          canvas, playheadCanvas, audio, thresholdSlider,
        //          thresholdValue, debounceSlider, debounceValue, copyBtn,
        //          status, errorEl } }
        const stemStates = new Map();

        // backingVocals is checked before vocals by iteration order in
        // STEM_DEFS, so "Backing Vocals.wav" is claimed first; the vocals
        // pattern's negative lookahead is a second guard against the same
        // misclassification.
        function matchStemKey(filename) {
            const stripped = filename.replace(/^\s*\d+[\s._-]+/, '');
            for (const def of STEM_DEFS) {
                if (def.match.test(stripped)) return def.key;
            }
            return null;
        }

        // RMS envelope, one sample per ~100ms window, normalized against the
        // track's own peak window (so quiet tracks still reach amp=1 at
        // their own loudest point).
        function computeRmsEnvelope(audioBuffer) {
            const sampleRate = audioBuffer.sampleRate;
            const windowMs = 100;
            const windowSamples = Math.round(sampleRate * windowMs / 1000);
            const ch0 = audioBuffer.getChannelData(0);
            const ch1 = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : null;
            const total = ch0.length;
            const env = [];
            let maxRms = 0;
            for (let start = 0; start < total; start += windowSamples) {
                const end = Math.min(total, start + windowSamples);
                let sumSq = 0;
                for (let i = start; i < end; i++) {
                    const s = ch1 ? (ch0[i] + ch1[i]) / 2 : ch0[i];
                    sumSq += s * s;
                }
                const rms = Math.sqrt(sumSq / (end - start));
                if (rms > maxRms) maxRms = rms;
                env.push({ t: Math.round(start / sampleRate * 1000), amp: rms });
            }
            if (maxRms > 0) {
                for (const e of env) e.amp = Math.min(1, e.amp / maxRms);
            }
            return { envelope: env, durationMs: Math.round(total / sampleRate * 1000) };
        }

        // Threshold-over-rolling-average onset detection with a debounce
        // window, per the design spec. rollWindow=15 samples = ~1.5s of
        // trailing context at the 100ms sampling rate above.
        function detectBeats(env, thresholdRatio, debounceMs) {
            const result = [];
            const rollWindow = 15;
            let lastBeatT = -Infinity;
            for (let i = 0; i < env.length; i++) {
                const start = Math.max(0, i - rollWindow);
                let sum = 0;
                for (let j = start; j < i; j++) sum += env[j].amp;
                const count = i - start;
                const avg = count > 0 ? sum / count : 0;
                const isOnset = env[i].amp > avg * thresholdRatio && env[i].amp > 0.05;
                if (isOnset && env[i].t - lastBeatT >= debounceMs) {
                    result.push(env[i].t);
                    lastBeatT = env[i].t;
                }
            }
            return result;
        }

        async function analyzeStemFile(key, label, file) {
            let state = stemStates.get(key);
            if (!state) {
                state = createStemPanel(key, label);
                stemStates.set(key, state);
            }
            state.els.status.textContent = 'Analyzing...';
            state.els.thresholdSlider.disabled = true;
            state.els.debounceSlider.disabled = true;
            state.els.copyBtn.disabled = true;
            state.els.errorEl.style.display = 'none';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const offlineCtx = new OfflineAudioContext(2, 1, 44100); // throwaway ctx, decodeAudioData only
                const audioBuffer = await offlineCtx.decodeAudioData(arrayBuffer);
                const result = computeRmsEnvelope(audioBuffer);
                state.envelope = result.envelope;
                state.durationMs = result.durationMs;
                state.threshold = 1.35;
                state.debounce = 200;
                state.els.thresholdSlider.value = '1.35';
                state.els.thresholdValue.textContent = '1.35';
                state.els.debounceSlider.value = '200';
                state.els.debounceValue.textContent = '200';

                if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
                state.objectUrl = URL.createObjectURL(file);
                state.els.audio.src = state.objectUrl;

                state.els.thresholdSlider.disabled = false;
                state.els.debounceSlider.disabled = false;
                state.els.copyBtn.disabled = false;
                reanalyzeStem(key);
            } catch (err) {
                state.els.errorEl.textContent = `Failed to analyze file: ${err.message}`;
                state.els.errorEl.style.display = '';
                state.els.status.textContent = '';
            }
        }

        function reanalyzeStem(key) {
            const state = stemStates.get(key);
            if (!state || state.envelope.length === 0) return;
            state.threshold = parseFloat(state.els.thresholdSlider.value);
            state.debounce = parseFloat(state.els.debounceSlider.value);
            state.beats = detectBeats(state.envelope, state.threshold, state.debounce);
            renderStemWaveform(key);
            updateStemSummary(key);
        }

        function createStemPanel(key, label) {
            const host = document.getElementById('stemPanels');
            const panel = document.createElement('div');
            panel.className = 'stem-panel';
            panel.innerHTML = `
                <div class="stem-header">
                    <span class="stem-title">${label}</span>
                    <span class="stem-summary"></span>
                </div>
                <div class="stem-body">
                    <div class="stem-error" style="display:none;"></div>
                    <div class="stem-canvas-host">
                        <canvas class="waveform"></canvas>
                        <canvas class="playhead"></canvas>
                    </div>
                    <audio controls></audio>
                    <div class="tune-row">
                        <label>Onset threshold (&times; rolling avg)</label>
                        <input type="range" class="threshold-slider" min="1" max="3" step="0.05" value="1.35">
                        <span class="tune-value threshold-value">1.35</span>
                    </div>
                    <div class="tune-row">
                        <label>Debounce (ms)</label>
                        <input type="range" class="debounce-slider" min="50" max="500" step="10" value="200">
                        <span class="tune-value debounce-value">200</span>
                    </div>
                    <button class="copy-btn">Copy JSON (music-cues-${key}.json)</button>
                    <div class="status"></div>
                </div>
            `;
            host.appendChild(panel);

            const els = {
                panel,
                header: panel.querySelector('.stem-header'),
                summary: panel.querySelector('.stem-summary'),
                body: panel.querySelector('.stem-body'),
                errorEl: panel.querySelector('.stem-error'),
                canvas: panel.querySelector('canvas.waveform'),
                playheadCanvas: panel.querySelector('canvas.playhead'),
                audio: panel.querySelector('audio'),
                thresholdSlider: panel.querySelector('.threshold-slider'),
                thresholdValue: panel.querySelector('.threshold-value'),
                debounceSlider: panel.querySelector('.debounce-slider'),
                debounceValue: panel.querySelector('.debounce-value'),
                copyBtn: panel.querySelector('.copy-btn'),
                status: panel.querySelector('.status'),
            };

            els.header.addEventListener('click', () => {
                panel.classList.toggle('expanded');
            });
            els.thresholdSlider.addEventListener('input', (e) => {
                els.thresholdValue.textContent = e.target.value;
                reanalyzeStem(key);
            });
            els.debounceSlider.addEventListener('input', (e) => {
                els.debounceValue.textContent = e.target.value;
                reanalyzeStem(key);
            });
            els.copyBtn.addEventListener('click', () => copyStemJson(key));
            els.audio.addEventListener('timeupdate', () => drawPlayhead(key));

            return {
                key, label,
                envelope: [], durationMs: 0, beats: [],
                threshold: 1.35, debounce: 200,
                objectUrl: null,
                els,
            };
        }

        function updateStemSummary(key) {
            const state = stemStates.get(key);
            state.els.summary.textContent =
                `${(state.durationMs / 1000).toFixed(1)}s, ${state.beats.length} beats`;
            state.els.status.textContent =
                `${(state.durationMs / 1000).toFixed(1)}s track, ${state.envelope.length} envelope samples, ${state.beats.length} beats detected`;
        }

        async function copyStemJson(key) {
            const state = stemStates.get(key);
            const doc = { version: 1, durationMs: state.durationMs, envelope: state.envelope, beats: state.beats };
            await navigator.clipboard.writeText(JSON.stringify(doc, null, 4));
            const btn = state.els.copyBtn;
            const original = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => { btn.textContent = original; }, 1200);
        }

        function downloadStemJson(key) {
            const state = stemStates.get(key);
            const doc = { version: 1, durationMs: state.durationMs, envelope: state.envelope, beats: state.beats };
            const blob = new Blob([JSON.stringify(doc, null, 4)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `music-cues-${key}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        // Browsers throttle/block rapid-fire multi-download triggers from a
        // single click; a short stagger keeps each save-file prompt/download
        // from getting dropped when several stems are analyzed at once.
        function downloadAllStemJson() {
            const keys = [...stemStates.keys()].filter(k => stemStates.get(k).envelope.length > 0);
            keys.forEach((key, i) => setTimeout(() => downloadStemJson(key), i * 300));
        }

        function renderStemWaveform(key) {
            const state = stemStates.get(key);
            const canvas = state.els.canvas;
            const playheadCanvas = state.els.playheadCanvas;
            const pxPerSec = 60;
            const width = Math.max(600, Math.round(state.durationMs / 1000 * pxPerSec));
            canvas.width = width;
            canvas.height = 200;
            playheadCanvas.width = width;
            playheadCanvas.height = 200;

            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#1e2a38';
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = '#4fd1c5';
            ctx.lineWidth = 1;
            ctx.beginPath();
            state.envelope.forEach((e, i) => {
                const x = (e.t / state.durationMs) * w;
                const y = h - e.amp * h;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();

            ctx.strokeStyle = '#f7ba32';
            ctx.lineWidth = 1;
            state.beats.forEach(bt => {
                const x = (bt / state.durationMs) * w;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            });

            drawPlayhead(key);
        }

        function drawPlayhead(key) {
            const state = stemStates.get(key);
            if (!state || state.durationMs === 0) return;
            const canvas = state.els.playheadCanvas;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            const currentMs = state.els.audio.currentTime * 1000;
            const x = (currentMs / state.durationMs) * w;
            ctx.strokeStyle = '#ff5555';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
            ctx.stroke();
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            const unrecognized = [];
            for (const file of files) {
                const key = matchStemKey(file.name);
                if (!key) {
                    unrecognized.push(file.name);
                    continue;
                }
                const def = STEM_DEFS.find(d => d.key === key);
                analyzeStemFile(key, def.label, file);
            }
            document.getElementById('unrecognizedStatus').textContent =
                unrecognized.length
                    ? `Unrecognized (not analyzed): ${unrecognized.join(', ')}`
                    : '';
        });

        document.getElementById('btnDownloadAll').addEventListener('click', downloadAllStemJson);
    </script>
</body>
</html>
