<!-- User Profile Module -->
<div class="card">
  <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
    <div style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--blue-500), var(--purple-500)); display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">
      👤
    </div>
    <div>
      <h1 style="margin: 0; color: var(--blue-400);" id="profileDisplayName">User Profile</h1>
      <p style="margin: 5px 0 0 0; color: var(--slate-400);" id="profileEmail">Loading...</p>
    </div>
  </div>

  <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
    <div class="stat-card">
      <div class="stat-label">Role</div>
      <div class="stat-value" id="profileRole">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Account Created</div>
      <div class="stat-value" id="profileCreated">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Team Assignment</div>
      <div class="stat-value" id="profileTeam">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tournament</div>
      <div class="stat-value" id="profileTournament">-</div>
    </div>
  </div>

  <div style="margin-top: 30px; padding-top: 30px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
    <h3 style="color: var(--slate-300); margin-bottom: 15px;">Profile Information</h3>
    <div style="display: grid; gap: 15px;">
      <div>
        <label style="color: var(--slate-400); font-size: 0.85rem; display: block; margin-bottom: 5px;">Display Name</label>
        <div style="color: var(--slate-200); font-size: 1rem;" id="profileFullName">-</div>
      </div>
      <div>
        <label style="color: var(--slate-400); font-size: 0.85rem; display: block; margin-bottom: 5px;">User ID</label>
        <div style="color: var(--slate-200); font-size: 0.9rem; font-family: monospace;" id="profileUserId">-</div>
      </div>
      <div>
        <label style="color: var(--slate-400); font-size: 0.85rem; display: block; margin-bottom: 5px;">Permissions</label>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;" id="profilePermissions">
          <!-- Permissions badges will be added here -->
        </div>
      </div>
    </div>
  </div>

  <div style="margin-top: 30px; padding-top: 30px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
    <button class="btn btn-secondary" onclick="window.navigateToModule('dashboard')">
      ← Back to Dashboard
    </button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // Get user profile from appRouter
  const userProfile = window.appRouter?.getUserProfile();
  const currentUser = firebase.auth().currentUser;

  if (userProfile && currentUser) {
    // Display name
    const displayName = userProfile.displayName || userProfile.firstName || 'User';
    document.getElementById('profileDisplayName').textContent = displayName;

    // Email
    document.getElementById('profileEmail').textContent = currentUser.email || 'No email';

    // Role
    const role = window.appRouter.getActualUserRole() || 'user';
    const roleElement = document.getElementById('profileRole');
    roleElement.textContent = role.toUpperCase();
    roleElement.style.color = role === 'god' ? 'var(--yellow-400)' : role === 'admin' ? 'var(--purple-400)' : 'var(--blue-400)';

    // Account created
    if (currentUser.metadata?.creationTime) {
      const createdDate = new Date(currentUser.metadata.creationTime);
      document.getElementById('profileCreated').textContent = createdDate.toLocaleDateString();
    }

    // Team assignment
    const teamElement = document.getElementById('profileTeam');
    if (userProfile.assignedTeamId !== undefined) {
      teamElement.textContent = `Team ${userProfile.assignedTeamId}`;
      teamElement.style.color = 'var(--green-400)';
    } else {
      teamElement.textContent = 'Not assigned';
      teamElement.style.color = 'var(--slate-400)';
    }

    // Tournament
    const tournamentElement = document.getElementById('profileTournament');
    if (userProfile.assignedGameId) {
      tournamentElement.textContent = 'Assigned';
      tournamentElement.style.color = 'var(--green-400)';
    } else {
      tournamentElement.textContent = 'Not assigned';
      tournamentElement.style.color = 'var(--slate-400)';
    }

    // Full name
    document.getElementById('profileFullName').textContent = displayName;

    // User ID
    document.getElementById('profileUserId').textContent = currentUser.uid;

    // Permissions
    const permissionsEl = document.getElementById('profilePermissions');
    const permissions = [];

    if (userProfile.isGod) {
      permissions.push('<span style="background: linear-gradient(135deg, var(--yellow-400), var(--orange-500)); color: var(--slate-900); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;">🔱 GOD</span>');
    }
    if (userProfile.isAdmin) {
      permissions.push('<span style="background: linear-gradient(135deg, var(--purple-500), var(--purple-600)); color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;">👑 ADMIN</span>');
    }
    if (userProfile.isPlayer) {
      permissions.push('<span style="background: linear-gradient(135deg, var(--blue-400), var(--blue-500)); color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;">🎮 PLAYER</span>');
    }

    if (permissions.length > 0) {
      permissionsEl.innerHTML = permissions.join('');
    } else {
      permissionsEl.innerHTML = '<span style="color: var(--slate-400); font-size: 0.9rem;">No special permissions</span>';
    }
  }
})();
</script>
