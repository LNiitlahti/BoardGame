                <div class="score-bar-row sb-t1"><span class="sb-name">—</span><div class="sb-track"><div class="sb-fill" style="width:0%"></div><div class="sb-ticks"><span class="sb-tick" style="left:20%"></span><span class="sb-tick" style="left:40%"></span><span class="sb-tick" style="left:60%"></span><span class="sb-tick" style="left:80%"></span></div></div><span class="sb-pts-val">0</span></div>
                <div class="score-bar-row sb-t2"><span class="sb-name">—</span><div class="sb-track"><div class="sb-fill" style="width:0%"></div><div class="sb-ticks"><span class="sb-tick" style="left:20%"></span><span class="sb-tick" style="left:40%"></span><span class="sb-tick" style="left:60%"></span><span class="sb-tick" style="left:80%"></span></div></div><span class="sb-pts-val">0</span></div>
                <div class="score-bar-row sb-t3"><span class="sb-name">—</span><div class="sb-track"><div class="sb-fill" style="width:0%"></div><div class="sb-ticks"><span class="sb-tick" style="left:20%"></span><span class="sb-tick" style="left:40%"></span><span class="sb-tick" style="left:60%"></span><span class="sb-tick" style="left:80%"></span></div></div><span class="sb-pts-val">0</span></div>
                <div class="score-bar-row sb-t4"><span class="sb-name">—</span><div class="sb-track"><div class="sb-fill" style="width:0%"></div><div class="sb-ticks"><span class="sb-tick" style="left:20%"></span><span class="sb-tick" style="left:40%"></span><span class="sb-tick" style="left:60%"></span><span class="sb-tick" style="left:80%"></span></div></div><span class="sb-pts-val">0</span></div>
                <div class="score-bar-row sb-t5"><span class="sb-name">—</span><div class="sb-track"><div class="sb-fill" style="width:0%"></div><div class="sb-ticks"><span class="sb-tick" style="left:20%"></span><span class="sb-tick" style="left:40%"></span><span class="sb-tick" style="left:60%"></span><span class="sb-tick" style="left:80%"></span></div></div><span class="sb-pts-val">0</span></div>
            </div>
            <div class="board-wrap"><div id="hexBoard"></div></div>
        </div>

        <!-- UPCOMING QUEUE — Right panel -->
        <!-- TODO:FIREBASE — Listen to queue collection, render cards dynamically -->
        <div class="side-panel queue-panel">
            <div class="panel-title">Upcoming</div>
            <div class="panel-list" id="queueList">
            </div>
        </div>

        <!-- SCORE STRIP — Bottom -->
        <!-- TODO:FIREBASE — Bind team points and wins from tournament state -->
        <div class="score-strip" id="scoreStrip">
            <div class="sc st1"><span class="sc-name">—</span><span class="sc-num sc-pts-v">0</span><span class="sc-num sc-wins-v">0</span><div class="sc-players"></div></div>
            <div class="sc st2"><span class="sc-name">—</span><span class="sc-num sc-pts-v">0</span><span class="sc-num sc-wins-v">0</span><div class="sc-players"></div></div>
            <div class="sc st3"><span class="sc-name">—</span><span class="sc-num sc-pts-v">0</span><span class="sc-num sc-wins-v">0</span><div class="sc-players"></div></div>
            <div class="sc st4"><span class="sc-name">—</span><span class="sc-num sc-pts-v">0</span><span class="sc-num sc-wins-v">0</span><div class="sc-players"></div></div>
            <div class="sc st5"><span class="sc-name">—</span><span class="sc-num sc-pts-v">0</span><span class="sc-num sc-wins-v">0</span><div class="sc-players"></div></div>
        </div>

    </div>

    <!-- Firebase Scripts -->
    <script>window.BOARDGAME_BASE = '..';</script>
    <script src="../shared/scripts/firebase-loader.js"></script>
    <script src="../shared/scripts/games-config.js"></script>
    <script src="../shared/scripts/board-module.js"></script>
    <script src="../shared/scripts/board-renderer.js"></script>
    <script src="../shared/scripts/player-utils.js"></script>

    <script>
    // ====================================================================
    // VIEW-LIGHTWEIGHT V2 — Firebase Integration
    // ====================================================================

    let gameState = null;
    let boardModule = null;
    let boardRenderer = null;
    let activeListener = null;
    let resultLogListener = null;
    let resultLogCache = [];

    const urlParams = new URLSearchParams(window.location.search);
    const tournamentId = urlParams.get('tournamentId') || urlParams.get('tournament');

    // Team color defaults (maps to CSS variables --t1 through --t5)
    const TEAM_COLORS = {
        1: '#de392c',
        2: '#2278a3',
        3: '#2e9158',
        4: '#f7ba32',
        5: '#7a4fbf'
    };

    // ====================================================================
    // HEX BOARD RENDERER
    // ====================================================================

    function initBoard() {
        const hexBoardContainer = document.getElementById('hexBoard');
        if (!hexBoardContainer) return;

        // Initialize board at 1.5x resolution for better quality when scaled down
        boardModule = new BoardModule(1.5);
        boardRenderer = new BoardRenderer(hexBoardContainer, boardModule, {
            responsive: true,
            showHeartImages: true,
            hexScale: 1.5
        });
        boardRenderer.render({});

        // Apply visual effects
        applyInitialEffects();
    }

    function renderBoard() {
        if (!boardRenderer || !boardModule) return;

        // Load room hexes into board module if available
        if (gameState?.rooms && boardModule) {
            boardModule.setRoomHexes(gameState.rooms);
        }

        boardRenderer.render(gameState || {});

        // Add team colors to hexes based on board state
        const hexes = document.querySelectorAll('.board-hex');
        hexes.forEach(hex => {
            const coord = hex.dataset.coord;

            // Remove old team classes
            hex.classList.remove('team-1', 'team-2', 'team-3', 'team-4', 'team-5');

            // Add team color class if hex is controlled
            if (gameState?.board && gameState.board[coord]) {
                const teamId = gameState.board[coord];
                hex.classList.add(`team-${teamId}`);
            }
        });
    }

    /**
     * Apply hex terrain images dynamically via CSS
     */
    function applyHexImages(enabled) {
        let styleEl = document.getElementById('hex-images-dynamic-css');

        if (!enabled) {
            if (styleEl) styleEl.remove();
            return;
        }

        if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = 'hex-images-dynamic-css';
            document.head.appendChild(styleEl);
        }

        // Generate CSS rules for each hex coordinate
        const hexCoords = boardModule.generateHexCoordinates();
        let css = '';

        hexCoords.forEach(([q, r]) => {
            const coord = `q${q}r${r}`;
            css += `body.effect-hex-images .board-hex[data-coord="${coord}"]::before {
                background-image: url('../shared/images/hexes/coords/${coord}.png');
            }\n`;
        });

        styleEl.textContent = css;
    }

    /**
     * Apply all visual effects (always enabled for display view)
     */
    function applyInitialEffects() {
        // Enable all visual effects for display view
        document.body.classList.add('effect-hex-images');
        document.body.classList.add('effect-heart-glow');
        document.body.classList.add('effect-pulse-hearts');
        document.body.classList.add('effect-rooms');

        // Apply hex terrain images
        applyHexImages(true);
    }

    // ====================================================================
    // CLOCK & MATCH TIMERS
    // ====================================================================

    function updateClock() {
        document.getElementById('clock').textContent =
            new Date().toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
    }

    // Track match start times for elapsed timers
    let matchStartTimes = { match1: null, match2: null };

    // Cache for diff-based rendering (avoid unnecessary innerHTML rebuilds)
    let prevArenaSignatures = { match1: null, match2: null };
    let prevQueueSignature = null;
    let prevResultIds = [];

    function getMatchSignature(match) {
        if (!match) return null;
        try { return JSON.stringify(match); }
        catch { return String(Math.random()); }
    }

    function updateMatchTimers() {
        const fmt = s => {
            const secs = Math.floor(s);
            return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
        };

        const now = Date.now();

        ['match1', 'match2'].forEach((matchId, idx) => {
            const el = document.getElementById(`elapsed${idx + 1}`);
            if (el && matchStartTimes[matchId]) {
                const elapsed = (now - matchStartTimes[matchId]) / 1000;
                el.textContent = fmt(elapsed);
            }
        });
    }

    // ====================================================================
    // FIREBASE LISTENER
    // ====================================================================

    // Diff guard: skip re-renders when only irrelevant fields changed
    let prevViewSignature = null;
    const VIEW_EXCLUDED_KEYS = ['onboarding', 'smartMatchState'];

    function getViewRelevantSignature(data) {
        const parts = [];
        for (const key of Object.keys(data).sort()) {
            if (VIEW_EXCLUDED_KEYS.includes(key)) continue;
            try { parts.push(key + ':' + JSON.stringify(data[key])); }
            catch { parts.push(key + ':' + String(data[key])); }
        }
        return parts.join('|');
    }

    function setupTournamentListener() {
        if (!tournamentId) {
            console.warn('No tournament ID provided');
            return;
        }

        const db = window.firebaseDB;
        if (!db) {
            console.error('Firebase database not available');
            return;
        }

        const tournamentRef = db.collection('tournaments').doc(tournamentId);

        activeListener = window.firebaseOnSnapshot(tournamentRef, (docSnapshot) => {
            if (docSnapshot.exists) {
                const newData = docSnapshot.data();
                const newSig = getViewRelevantSignature(newData);

                gameState = newData;
                gameState.tournamentId = tournamentId;

                if (newSig !== prevViewSignature) {
                    prevViewSignature = newSig;
                    updateDisplay();
                }
            } else {
                console.warn('Tournament not found:', tournamentId);
            }
        }, (error) => {
            console.error('Listener error:', error);
        });

        // Set up result log listener
        setupResultLogListener();
    }

    function setupResultLogListener() {
        if (!tournamentId) return;

        const db = window.firebaseDB;
        if (!db) return;

        if (resultLogListener) {
            resultLogListener();
            resultLogListener = null;
        }

        const resultLogRef = db.collection('tournaments')
            .doc(tournamentId)
            .collection('eventLog')
            .orderBy('timestamp', 'desc')
            .limit(30);

        resultLogListener = window.firebaseOnSnapshot(resultLogRef, (snapshot) => {
            resultLogCache = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                data.id = doc.id;
                if (data.timestamp?.toDate) {
                    data.timestamp = data.timestamp.toDate();
                }
                if (data.type === 'game_win' || data.type === 'match_complete') {
                    resultLogCache.push(data);
                }
            });
            renderResults();
        }, (error) => {
            console.error('Result log listener error:', error);
        });
    }

    // ====================================================================
    // DISPLAY UPDATES
    // ====================================================================

    function updateDisplay() {
        if (!gameState) return;

        // Apply team colors to CSS variables
        applyTeamColors();

        // Update tournament name and logo
        const titleEl = document.getElementById('hTitle');
        const iconEl = document.getElementById('hIcon');
        if (titleEl) {
            const tournamentName = gameState.name || gameState.friendlyName || 'Tournament';
            titleEl.textContent = tournamentName;
            document.title = `${tournamentName} — Infoscreen`;
        }
        if (iconEl && gameState.logoUrl) {
            iconEl.innerHTML = `<img src="${gameState.logoUrl}" alt="" style="width:100%;height:100%;object-fit:contain;border-radius:3px;">`;
        }

        // Update header stats
        document.getElementById('hRound').textContent = gameState.currentRound || 0;
        document.getElementById('hGames').textContent = gameState.gamesPlayed || 0;

        const queuedCount = (gameState.gameQueue || []).filter(g => g.status !== 'completed').length;
        document.getElementById('hQueue').textContent = queuedCount;

        // Update board
        renderBoard();

        // Update score bars
        renderScoreBars();

        // Update matches (arena + queue)
        renderMatches();

        // Update score strip
        renderScoreStrip();
    }

    function applyTeamColors() {
        if (!gameState?.teams) return;

        const root = document.documentElement;
        gameState.teams.forEach(team => {
            const color = team.color || TEAM_COLORS[team.id];
            if (color) {
                root.style.setProperty(`--t${team.id}`, color);
                // Also set hex alpha version
                const hex = color.replace('#', '');
                const r = parseInt(hex.substring(0, 2), 16);
                const g = parseInt(hex.substring(2, 4), 16);
                const b = parseInt(hex.substring(4, 6), 16);
                root.style.setProperty(`--t${team.id}-hex`, `rgba(${r}, ${g}, ${b}, 0.5)`);
            }
        });
    }

    function renderScoreBars() {
        const teams = gameState?.teams || [];
        const victoryCondition = gameState?.victoryCondition || 50;

        // Sort teams by points descending
        const sorted = [...teams].sort((a, b) => (b.points || 0) - (a.points || 0));

        sorted.forEach((team, idx) => {
            const row = document.querySelectorAll('.score-bar-row')[idx];
            if (!row) return;

            const points = team.points || 0;
            const percentage = Math.min((points / victoryCondition) * 100, 100);

            // Update the row's team class
            row.className = `score-bar-row sb-t${team.id}`;
            row.querySelector('.sb-name').textContent = team.name || `Team ${team.id}`;
            row.querySelector('.sb-fill').style.width = `${percentage}%`;
            row.querySelector('.sb-pts-val').textContent = points;
        });
    }

    function renderMatches() {
        const queue = (gameState?.gameQueue || []).filter(g => g.status !== 'completed');

        // Sort: ongoing first, then pending
        const sorted = [...queue].sort((a, b) => {
            if (a.status === 'ongoing' && b.status !== 'ongoing') return -1;
            if (a.status !== 'ongoing' && b.status === 'ongoing') return 1;
            return 0;
        });

        // Get ongoing matches for the arena
        const ongoingMatches = sorted.filter(m => m.status === 'ongoing').slice(0, 2);
        const pendingMatches = sorted.filter(m => m.status !== 'ongoing');

        // Render arena matches
        renderArenaMatch('match1', ongoingMatches[0], 1);
        renderArenaMatch('match2', ongoingMatches[1], 2);

        // Render queue
        renderQueue(pendingMatches);
    }

    function renderArenaMatch(matchId, match, slotNum) {
        const matchEl = document.getElementById(matchId);
        if (!matchEl) return;

        // Skip rebuild if match hasn't structurally changed (timer ticks independently)
        const newSig = getMatchSignature(match);
        if (newSig === prevArenaSignatures[matchId]) {
            // Still update start time in case it was refined
            if (match && match.startedAt) {
                if (match.startedAt?.toDate) {
                    matchStartTimes[matchId] = match.startedAt.toDate().getTime();
                } else {
                    matchStartTimes[matchId] = new Date(match.startedAt).getTime();
                }
            }
            return;
        }
        prevArenaSignatures[matchId] = newSig;

        if (!match) {
            // Empty slot
            matchEl.innerHTML = `
                <div class="match-complete-overlay">
                    <span class="match-complete-text">Match Complete</span>
                </div>
                <div class="a-side left" style="--side-color:var(--text-dim)">
                    <div class="a-players">
                        <div class="a-player" style="--pc:var(--text-dim)">
                            <span class="a-dot" style="background:var(--text-dim)"></span>
                            <div class="a-info"><span class="a-name" style="color:var(--text-dim)">Waiting...</span></div>
                        </div>
                    </div>
                </div>
                <div class="a-center">
                    <span class="a-game-name">No Match</span>
                    <span class="a-vs">VS</span>
                    <span class="a-format">—</span>
                </div>
                <div class="a-side right" style="--side-color:var(--text-dim)">
                    <div class="a-players">
                        <div class="a-player" style="--pc:var(--text-dim)">
                            <span class="a-dot" style="background:var(--text-dim)"></span>
                            <div class="a-info"><span class="a-name" style="color:var(--text-dim)">Waiting...</span></div>
                        </div>
                    </div>
                </div>
            `;
            matchStartTimes[matchId] = null;
            return;
        }

        const teams = match.teams || [];
        const gameName = getGameDisplayName(match.game);
        const playType = match.playType || '';

        // Set match start time for timer
        if (match.startedAt?.toDate) {
            matchStartTimes[matchId] = match.startedAt.toDate().getTime();
        } else if (match.startedAt) {
            matchStartTimes[matchId] = new Date(match.startedAt).getTime();
        } else {
            matchStartTimes[matchId] = Date.now();
        }

        // Build player HTML for each side
        const buildSidePlayers = (teamData) => {
            const players = getMatchTeamPlayers(teamData);
            return players.map(p => {
                const color = getPlayerCurrentColor(p);
                const teamName = getCurrentTeamName(p.originalTeamId);
                return `
                    <div class="a-player" style="--pc:${color}">
                        <span class="a-dot" style="background:${color};color:${color}"></span>
                        <div class="a-info">
                            <span class="a-name" style="color:${color}">${getPlayerCurrentName(p)}</span>
                            <span class="a-team">${teamName}</span>
                        </div>
                    </div>
                `;
            }).join('');
        };

        // Determine dominant color for each side
        const getDominantColor = (teamData) => {
            const players = getMatchTeamPlayers(teamData);
            if (players.length === 0) return 'var(--text-dim)';
            return getPlayerCurrentColor(players[0]);
        };

        const leftColor = getDominantColor(teams[0]);
        const rightColor = getDominantColor(teams[1]);
        const isThreeTeam = teams.length >= 3;

        // Remove/add three-team class
        matchEl.classList.toggle('three-team', isThreeTeam);

        if (isThreeTeam) {
            // 3-team layout (2v2v2): teams[0] VS teams[1] VS teams[2]
            const thirdColor = getDominantColor(teams[2]);
            matchEl.innerHTML = `
                <div class="match-complete-overlay">
                    <span class="match-complete-text">Match Complete</span>
                </div>
                <div class="a-side left" style="--side-color:${leftColor}">
                    <div class="a-players">${buildSidePlayers(teams[0])}</div>
                </div>
                <div class="a-vs-divider"><span class="a-vs-small">VS</span></div>
                <div class="a-side center" style="--side-color:${rightColor}">
                    <div class="a-players">${buildSidePlayers(teams[1])}</div>
                </div>
                <div class="a-vs-divider"><span class="a-vs-small">VS</span></div>
                <div class="a-side right" style="--side-color:${thirdColor}">
                    <div class="a-players">${buildSidePlayers(teams[2])}</div>
                </div>
                <div style="position:absolute;top:calc(50% - 75px);left:50%;transform:translate(-50%,-50%);z-index:10;">
                    <span class="a-live-badge">● LIVE</span>
                </div>
                <div class="a-center" style="position:absolute;top:calc(50% + 100px);left:50%;transform:translate(-50%,-50%);width:auto;">
                    <span class="a-game-name">${gameName}</span>
                    <span class="a-format">${playType}</span>
                    <span class="a-timer">⏱ <span id="elapsed${slotNum}">00:00</span></span>
                </div>
            `;
        } else {
            // Standard 2-team layout
            matchEl.innerHTML = `
                <div class="match-complete-overlay">
                    <span class="match-complete-text">Match Complete</span>
                </div>
                <div class="a-side left" style="--side-color:${leftColor}">
                    <div class="a-players">${buildSidePlayers(teams[0])}</div>
                </div>
                <div class="a-center">
                    <span class="a-live-badge">● LIVE</span>
                    <span class="a-game-name">${gameName}</span>
                    <span class="a-vs">VS</span>
                    <span class="a-format">${playType}</span>
                    <span class="a-timer">⏱ <span id="elapsed${slotNum}">00:00</span></span>
                </div>
                <div class="a-side right" style="--side-color:${rightColor}">
                    <div class="a-players">${buildSidePlayers(teams[1])}</div>
                </div>
            `;
        }
    }

    function renderQueue(pendingMatches) {
        const container = document.getElementById('queueList');
        if (!container) return;

        // Skip rebuild if queue hasn't changed
        const newQueueSig = pendingMatches.length === 0
            ? '__empty__'
            : pendingMatches.map(m => getMatchSignature(m)).join('||');
        if (newQueueSig === prevQueueSignature) return;
        prevQueueSignature = newQueueSig;

        if (pendingMatches.length === 0) {
            container.innerHTML = '<div class="q-card q-compact" style="opacity:0.5;text-align:center;padding:20px;">No upcoming matches</div>';
            return;
        }

        container.innerHTML = pendingMatches.map((match, idx) => {
            const isNext = idx === 0;
            const isChallenge = match.isChallenge === true;
            const teams = match.teams || [];
            const gameName = getGameDisplayName(match.game);
            const playType = match.playType || '';

            const isThreeTeam = teams.length >= 3;

            if (isNext) {
                // NEXT card (expanded)
                const buildNextSide = (teamData, sideClass) => {
                    const players = getMatchTeamPlayers(teamData);
                    const borderProp = sideClass === 'a' ? 'border-right-color' : 'border-left-color';
                    return players.map(p => {
                        const color = getPlayerCurrentColor(p);
                        return `<span class="q-next-name" style="color:${color};${borderProp}:${color}">${getPlayerCurrentName(p)}</span>`;
                    }).join('');
                };

                if (isThreeTeam) {
                    // 3-team: teams[0] VS teams[1] VS teams[2]
                    return `
                        <div class="q-card q-next ${isChallenge ? 'challenge' : ''}">
                            <div class="q-next-top">
                                <span class="q-next-game">${isChallenge ? '⚔ ' : ''}${gameName}</span>
                                <span class="q-next-badge">NEXT</span>
                            </div>
                            <div class="q-next-matchup">
                                <div class="q-next-side a">${buildNextSide(teams[0], 'a')}</div>
                                <span class="q-next-vs">VS</span>
                                <div class="q-next-side" style="align-items:center">${buildNextSide(teams[1], 'b')}</div>
                                <span class="q-next-vs">VS</span>
                                <div class="q-next-side b">${buildNextSide(teams[2], 'b')}</div>
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="q-card q-next ${isChallenge ? 'challenge' : ''}">
                        <div class="q-next-top">
                            <span class="q-next-game">${isChallenge ? '⚔ ' : ''}${gameName}</span>
                            <span class="q-next-badge">NEXT</span>
                        </div>
                        <div class="q-next-matchup">
                            <div class="q-next-side a">${buildNextSide(teams[0], 'a')}</div>
                            <span class="q-next-vs">VS</span>
                            <div class="q-next-side b">${buildNextSide(teams[1], 'b')}</div>
                        </div>
                    </div>
                `;
            }

            // Compact queued card
            const buildCompactSide = (teamData, sideClass) => {
                const players = getMatchTeamPlayers(teamData);
                const borderProp = sideClass === 'a' ? 'border-right-color' : 'border-left-color';
                return players.map(p => {
                    const color = getPlayerCurrentColor(p);
                    return `<span class="qc-name" style="color:${color};${borderProp}:${color}">${getPlayerCurrentName(p)}</span>`;
                }).join('');
            };

            if (isThreeTeam) {
                // 3-team: teams[0] VS teams[1] VS teams[2]
                return `
                    <div class="q-card q-compact ${isChallenge ? 'challenge' : ''}">
                        <div class="qc-top">
                            <span class="qc-game">${isChallenge ? '⚔ ' : ''}${getGameDisplayName(match.game)}${playType ? ' · ' + playType : ''}</span>
                        </div>
                        <div class="qc-matchup">
                            <div class="qc-side a">${buildCompactSide(teams[0], 'a')}</div>
                            <span class="qc-vs">VS</span>
                            <div class="qc-side" style="align-items:center">${buildCompactSide(teams[1], 'b')}</div>
                            <span class="qc-vs">VS</span>
                            <div class="qc-side b">${buildCompactSide(teams[2], 'b')}</div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="q-card q-compact ${isChallenge ? 'challenge' : ''}">
                    <div class="qc-top">
                        <span class="qc-game">${isChallenge ? '⚔ ' : ''}${getGameDisplayName(match.game)}${playType ? ' · ' + playType : ''}</span>
                    </div>
                    <div class="qc-matchup">
                        <div class="qc-side a">${buildCompactSide(teams[0], 'a')}</div>
                        <span class="qc-vs">VS</span>
                        <div class="qc-side b">${buildCompactSide(teams[1], 'b')}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function buildResultCardHTML(event) {
        const time = event.timestamp instanceof Date
            ? formatTimeAgo(event.timestamp)
            : 'Just now';

        const gameName = event.gameName || 'Game';
        const isChallenge = event.isChallenge === true;

        const winningPlayers = event.winningPlayers || [];
        const losingPlayers = event.losingPlayers || [];
        const winningSide = event.winningSide || 'A';

        const playTypeRaw = event.playType || '';
        const hasThreeTeamFormat = /\d+v\d+v\d+/i.test(playTypeRaw);
        const hasSideCPlayers = event.sideCPlayers && event.sideCPlayers.length > 0;
        const isThreeTeam = event.teamsCount >= 3 || event.isThreeTeam || hasSideCPlayers || hasThreeTeamFormat;

        const playerCount = winningPlayers.length;
        const playType = playTypeRaw || (playerCount > 0 ? (isThreeTeam ? `${playerCount}v${playerCount}v${playerCount}` : `${playerCount}v${playerCount}`) : '');

        const buildResultPlayers = (players) => {
            if (!players || players.length === 0) {
                return '<span class="r-player" style="opacity:0.4">—</span>';
            }
            return players.map(p => {
                const color = getTeamColor(p.originalTeamId) || p.originalTeamColor || '#888';
                const name = p.name || 'Player';
                return `<span class="r-player" style="color:${color}; border-bottom: 2px solid ${color}">${name}</span>`;
            }).join('');
        };

        const aWin = winningSide?.toUpperCase() === 'A';
        const bWin = winningSide?.toUpperCase() === 'B';
        const cWin = winningSide?.toUpperCase() === 'C';

        if (isThreeTeam) {
            const sideAPlayers = event.sideAPlayers || (aWin ? winningPlayers : losingPlayers);
            const sideBPlayers = event.sideBPlayers || (bWin ? winningPlayers : losingPlayers);
            const sideCPlayers = event.sideCPlayers || (cWin ? winningPlayers : []);

            return `
                <div class="r-card" data-result-id="${event.id}" ${isChallenge ? 'style="border-left: 3px solid var(--danger)"' : ''}>
                    <div class="r-top">
                        <span class="r-game">${isChallenge ? '⚔ ' : ''}${gameName}${playType ? ' · ' + playType : ''}</span>
                        <span class="r-time">${time}</span>
                    </div>
                    <div class="r-matchup" style="gap:4px;align-items:flex-start;">
                        <div class="r-side a ${aWin ? 'winner' : 'loser'}" style="flex:1;flex-direction:column;align-items:flex-end;gap:4px;">
                            <div class="r-names">${buildResultPlayers(sideAPlayers)}</div>
                            ${aWin ? '<span class="r-badge win">WIN</span>' : ''}
                        </div>
                        <div class="r-vs"><span class="r-score-sep">VS</span></div>
                        <div class="r-side ${bWin ? 'winner' : 'loser'}" style="flex:1;flex-direction:column;align-items:center;gap:4px;">
                            <div class="r-names" style="align-items:center;">${buildResultPlayers(sideBPlayers)}</div>
                            ${bWin ? '<span class="r-badge win">WIN</span>' : ''}
                        </div>
                        <div class="r-vs"><span class="r-score-sep">VS</span></div>
                        <div class="r-side b ${cWin ? 'winner' : 'loser'}" style="flex:1;flex-direction:column;align-items:flex-start;gap:4px;">
                            <div class="r-names">${buildResultPlayers(sideCPlayers)}</div>
                            ${cWin ? '<span class="r-badge win">WIN</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        const sideAPlayers = aWin ? winningPlayers : losingPlayers;
        const sideBPlayers = bWin ? winningPlayers : losingPlayers;

        return `
            <div class="r-card" data-result-id="${event.id}" ${isChallenge ? 'style="border-left: 3px solid var(--danger)"' : ''}>
                <div class="r-top">
                    <span class="r-game">${isChallenge ? '⚔ ' : ''}${gameName}${playType ? ' · ' + playType : ''}</span>
                    <span class="r-time">${time}</span>
                </div>
                <div class="r-matchup">
                    <div class="r-side a ${aWin ? 'winner' : 'loser'}">
                        ${aWin ? '<span class="r-badge win">WIN</span>' : ''}
                        <div class="r-names">${buildResultPlayers(sideAPlayers)}</div>
                        ${!aWin ? '<span class="r-badge loss">LOSS</span>' : ''}
                    </div>
                    <div class="r-vs">
                        <span class="r-score-sep">VS</span>
                    </div>
                    <div class="r-side b ${bWin ? 'winner' : 'loser'}">
                        ${!bWin ? '<span class="r-badge loss">LOSS</span>' : ''}
                        <div class="r-names">${buildResultPlayers(sideBPlayers)}</div>
                        ${bWin ? '<span class="r-badge win">WIN</span>' : ''}
                    </div>
                </div>
            </div>
        `;
    }

    function renderResults() {
        const container = document.getElementById('resultsList');
        if (!container) return;

        const currentResults = resultLogCache.slice(0, 6);

        if (currentResults.length === 0) {
            if (prevResultIds.length > 0 || container.children.length === 0) {
                container.innerHTML = '<div class="r-card" style="opacity:0.5;text-align:center;padding:20px;">No results yet</div>';
                prevResultIds = [];
            }
            return;
        }

        const newIds = currentResults.map(e => e.id);

        // If results haven't changed, only refresh time-ago labels
        if (JSON.stringify(newIds) === JSON.stringify(prevResultIds)) {
            currentResults.forEach(event => {
                const card = container.querySelector('[data-result-id="' + event.id + '"]');
                if (!card) return;
                const timeEl = card.querySelector('.r-time');
                if (timeEl) {
                    timeEl.textContent = event.timestamp instanceof Date
                        ? formatTimeAgo(event.timestamp)
                        : 'Just now';
                }
            });
            return;
        }

        // Find how many new results appeared at the front
        let newCount = 0;
        for (let i = 0; i < newIds.length; i++) {
            if (!prevResultIds.includes(newIds[i])) {
                newCount++;
            } else {
                break;
            }
        }

        if (newCount > 0 && newCount < currentResults.length && prevResultIds.length > 0) {
            // Prepend only the new cards, remove excess from the end
            const newCardsHTML = currentResults.slice(0, newCount)
                .map(event => buildResultCardHTML(event)).join('');

            const temp = document.createElement('div');
            temp.innerHTML = newCardsHTML;

            // Insert new cards at the top (in correct order)
            const fragment = document.createDocumentFragment();
            while (temp.firstChild) {
                fragment.appendChild(temp.firstChild);
            }
            container.insertBefore(fragment, container.firstChild);

            // Remove excess cards from the end to keep max 6
            while (container.children.length > 6) {
                container.removeChild(container.lastChild);
            }
        } else {
            // Full rebuild (first render or all results changed)
            container.innerHTML = currentResults.map(event => buildResultCardHTML(event)).join('');
        }

        prevResultIds = newIds;
    }

    function renderScoreStrip() {
        const teams = gameState?.teams || [];

        teams.forEach(team => {
            const selector = `.sc.st${team.id}`;
            const el = document.querySelector(selector);
            if (!el) return;

            const color = team.color || TEAM_COLORS[team.id];
            const players = team.players || [];

            el.querySelector('.sc-name').textContent = team.name || `Team ${team.id}`;
            el.querySelector('.sc-pts-v').textContent = team.points || 0;
            el.querySelector('.sc-wins-v').textContent = team.gamesWon || 0;

            const playersContainer = el.querySelector('.sc-players');
            if (playersContainer) {
                playersContainer.innerHTML = players.map(p =>
                    `<span class="sc-player">${p.name || 'Player'}</span>`
                ).join('');
            }
        });
    }

    // ====================================================================
    // UTILITIES
    // ====================================================================

    function getGameDisplayName(gameId) {
        if (window.GAMES_CONFIG) {
            return window.GAMES_CONFIG.getGameName(gameId);
        }
        if (gameState?.gameDefinitions?.[gameId]?.name) {
            return gameState.gameDefinitions[gameId].name;
        }
        return gameId || 'Unknown';
    }

    function getGameShortName(gameId) {
        if (window.GAMES_CONFIG) {
            return window.GAMES_CONFIG.getShortName(gameId);
        }
        if (gameState?.gameDefinitions?.[gameId]?.shortName) {
            return gameState.gameDefinitions[gameId].shortName;
        }
        return gameId ? gameId.substring(0, 4).toUpperCase() : '?';
    }

    function getTeamColor(teamId) {
        if (teamId == null) return '#666666';
        if (gameState?.teams) {
            const team = gameState.teams.find(t => String(t.id) === String(teamId));
            if (team?.color) return team.color;
        }
        return TEAM_COLORS[teamId] || '#666666';
    }

    function getCurrentTeamName(teamId) {
        if (teamId && gameState?.teams) {
            const team = gameState.teams.find(t => String(t.id) === String(teamId));
            if (team?.name) return team.name;
        }
        return '';
    }

    function getPlayerCurrentName(player) {
        if (!player) return 'Unknown';
        if (player.id && player.originalTeamId && gameState?.teams) {
            const team = gameState.teams.find(t => String(t.id) === String(player.originalTeamId));
            if (team?.players) {
                const currentPlayer = team.players.find(p => p.id === player.id);
                if (currentPlayer?.name) return currentPlayer.name;
            }
        }
        return player.name || 'Unknown';
    }

    function getPlayerCurrentColor(player) {
        if (!player) return '#666666';
        if (player.originalTeamId && gameState?.teams) {
            const team = gameState.teams.find(t => String(t.id) === String(player.originalTeamId));
            if (team?.color) return team.color;
        }
        return player.originalTeamColor || getTeamColor(player.originalTeamId) || '#666666';
    }

    function getMatchTeamPlayers(matchTeam) {
        if (!matchTeam) return [];

        // New format: playerIds array
        if (matchTeam.playerIds && Array.isArray(matchTeam.playerIds)) {
            return matchTeam.playerIds.map(playerId => {
                if (window.PlayerUtils) {
                    const info = window.PlayerUtils.getPlayerDisplayInfo(gameState, playerId);
                    return {
                        id: playerId,
                        name: info.name,
                        originalTeamId: info.teamId,
                        originalTeamColor: info.teamId ? getTeamColor(info.teamId) : '#666666'
                    };
                }
                if (gameState?.players?.[playerId]) {
                    const p = gameState.players[playerId];
                    return {
                        id: playerId,
                        name: p.name || 'Unknown',
                        originalTeamId: p.teamId,
                        originalTeamColor: p.teamId ? getTeamColor(p.teamId) : '#666666'
                    };
                }
                return { id: playerId, name: 'Unknown', originalTeamId: null, originalTeamColor: '#666666' };
            });
        }

        // Old format: players array
        if (matchTeam.players && Array.isArray(matchTeam.players)) {
            return matchTeam.players.map(p => ({
                id: p.id || null,
                name: p.name || 'Unknown',
                originalTeamId: p.originalTeamId,
                originalTeamColor: p.originalTeamColor || getTeamColor(p.originalTeamId) || '#666666'
            }));
        }

        return [];
    }

    function formatTimeAgo(date) {
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);

        if (diffMins < 1) return 'Just now';
        if (diffMins === 1) return '1 min ago';
        if (diffMins < 60) return `${diffMins} min ago`;

        const diffHours = Math.floor(diffMins / 60);
        if (diffHours === 1) return '1h ago';
        if (diffHours < 24) return `${diffHours}h ago`;

        return date.toLocaleDateString('fi-FI');
    }

    // ====================================================================
    // MATCH TRANSITION API (keep for future use)
    // ====================================================================

    const TIMING = {
        OVERLAY_DURATION: 3500,      // Match the slower overlay animation
        MATCH_FADE_COMPLETE: 6000,   // Match the 5s match-finish animation
        QUEUE_REMOVE_DELAY: 2000,    // Match the 2s queue-promote-out animation
        PROMOTE_SETTLE: 5000,        // Match the 4s match-promote animation
    };

    function endMatch(matchId, winningSide, onComplete) {
        const matchEl = document.getElementById(matchId);
        if (!matchEl) return;

        const overlay = matchEl.querySelector('.match-complete-overlay');
        const winSide = matchEl.querySelector(`.a-side.${winningSide}`);

        if (winSide) winSide.classList.add('win-flash');
        if (overlay) overlay.classList.add('active');

        setTimeout(() => {
            matchEl.classList.add('finishing');
        }, TIMING.OVERLAY_DURATION);

        setTimeout(() => {
            if (onComplete) onComplete();
        }, TIMING.MATCH_FADE_COMPLETE);
    }

    // ====================================================================
    // INIT
    // ====================================================================

    document.addEventListener('DOMContentLoaded', () => {
        initBoard();
        updateClock();
        setInterval(updateClock, 1000);
        setInterval(updateMatchTimers, 1000);

        if (!tournamentId) {
            console.warn('No tournamentId in URL. Use ?tournamentId=xxx');
        }
    });

    document.addEventListener('firebase-ready', () => {
        console.log('Firebase ready, connecting to tournament:', tournamentId);
        setupTournamentListener();
    });
    </script>
</body>
