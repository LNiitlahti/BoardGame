<!DOCTYPE html>
<html lang="en">
<!--
    Mini status popup - opened from onboarding page.
    Params: ?tournamentId=xxx&player=p_xxxxx&secret=yyy
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Game - Onboarding Status</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .label {
            color: #6a7088;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 220px;
            flex: 1;
            max-height: 140px;
        }
        .sb {
            border-radius: 8px;
            border: 2px solid #2a2f3a;
            background: #161b22;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            opacity: 0.4;
            filter: grayscale(0.8);
            transition: all 0.15s ease;
            -webkit-user-select: none;
            user-select: none;
            min-height: 48px;
        }
        .sb:hover { opacity: 0.7; filter: grayscale(0.3); border-color: #444; }
        .sb.active {
            border-color: #f7ba32;
            background: rgba(247, 186, 50, 0.2);
            opacity: 1;
            filter: none;
            box-shadow: 0 0 12px rgba(247, 186, 50, 0.2);
        }
    </style>
</head>
<body>
    <div class="label">My Status</div>
    <div class="grid" id="grid">
        <button class="sb" data-s="eating" title="Eating"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:#f97316"><path d="m12 14-1 1"/><path d="m13.75 18.25-1.25 1.42"/><path d="M17.775 5.654a15.68 15.68 0 0 0-12.121 12.12"/><path d="M18.8 9.3a1 1 0 0 0 2.1 7.7"/><path d="M21.964 20.732a1 1 0 0 1-1.232 1.232l-18-5a1 1 0 0 1-.695-1.232A19.68 19.68 0 0 1 15.732 2.037a1 1 0 0 1 1.232.695z"/></svg></button>
        <button class="sb" data-s="smoking" title="Smoke break"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:#fef9c3"><path d="M17 12H3a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h14"/><path d="M18 8c0-2.5-2-2.5-2-5"/><path d="M21 16a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M22 8c0-2.5-2-2.5-2-5"/><path d="M7 12v4"/></svg></button>
        <button class="sb" data-s="wc" title="Bathroom"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:#9ca3af"><path d="M7 12h13a1 1 0 0 1 1 1 5 5 0 0 1-5 5h-.598a.5.5 0 0 0-.424.765l1.544 2.47a.5.5 0 0 1-.424.765H5.402a.5.5 0 0 1-.424-.765L7 18"/><path d="M8 18a5 5 0 0 1-5-5V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8"/></svg></button>
        <button class="sb" data-s="sleeping" title="Sleeping"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:#818cf8"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></button>
        <button class="sb" data-s="alert" title="Need attention"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:#ef4444"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg></button>
        <button class="sb" data-s="question" title="Question"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:#f59e0b"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
    </div>

    <script>window.BOARDGAME_BASE = '..';</script>
    <script src="../shared/scripts/firebase-loader.js"></script>
    <script defer src="../shared/scripts/hex-image-preloader.js"></script>
    <script src="../shared/scripts/resolve-tournament-id.js"></script>
    <script>
    const STATUS_KEYS = ['eating', 'smoking', 'wc', 'sleeping', 'alert', 'question'];
    const params = new URLSearchParams(window.location.search);
    const tournamentId = resolveTournamentId({
        search: window.location.search,
        paramNames: ['tournamentId'],
        legacyParamNames: ['tournament']
    });
    const playerId = params.get('player');
    let onboardingRef = null;
    let currentStatuses = {};

    document.addEventListener('firebase-ready', () => {
        if (!tournamentId || !playerId) return;
        const db = window.firebaseDB;
        onboardingRef = db.collection('tournaments').doc(tournamentId)
            .collection('onboarding').doc('state');

        // Listen for real-time updates
        window.firebaseOnSnapshot(onboardingRef, (snap) => {
            if (!snap.exists) return;
            const data = snap.data();
            currentStatuses = data?.players?.[playerId]?.statuses || {};
            renderButtons();
        });
    });

    function renderButtons() {
        document.querySelectorAll('.sb').forEach(btn => {
            btn.classList.toggle('active', !!currentStatuses[btn.dataset.s]);
        });
    }

    document.getElementById('grid').addEventListener('click', (e) => {
        const btn = e.target.closest('.sb');
        if (!btn || !onboardingRef) return;
        const key = btn.dataset.s;
        const wasActive = !!currentStatuses[key];

        // Exclusive: clear all, then set if toggling on
        const updates = {};
        for (const k of STATUS_KEYS) {
            updates[`players.${playerId}.statuses.${k}`] = false;
        }
        if (!wasActive) {
            updates[`players.${playerId}.statuses.${key}`] = true;
        }
        updates[`players.${playerId}.lastUpdated`] = new Date().toISOString();

        onboardingRef.update(updates).catch(err => console.error('Save failed:', err));
    });
    </script>
</body>
</html>
