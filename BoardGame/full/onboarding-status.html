<!DOCTYPE html>
<html lang="en">
<!--
    Mini status popup - opened from onboarding page.
    Params: ?tournamentId=xxx&player=p_xxxxx&secret=yyy
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .label {
            color: #6a7088;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 220px;
            flex: 1;
            max-height: 140px;
        }
        .sb {
            border-radius: 8px;
            border: 2px solid #2a2f3a;
            background: #161b22;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            opacity: 0.4;
            filter: grayscale(0.8);
            transition: all 0.15s ease;
            -webkit-user-select: none;
            user-select: none;
            min-height: 48px;
        }
        .sb:hover { opacity: 0.7; filter: grayscale(0.3); border-color: #444; }
        .sb.active {
            border-color: #f7ba32;
            background: rgba(247, 186, 50, 0.2);
            opacity: 1;
            filter: none;
            box-shadow: 0 0 12px rgba(247, 186, 50, 0.2);
        }
    </style>
</head>
<body>
    <div class="label">My Status</div>
    <div class="grid" id="grid">
        <button class="sb" data-s="eating" title="Eating">🍔</button>
        <button class="sb" data-s="smoking" title="Smoke break">🚬</button>
        <button class="sb" data-s="wc" title="Bathroom">🚽</button>
        <button class="sb" data-s="sleeping" title="Sleeping">😴</button>
        <button class="sb" data-s="alert" title="Need attention">❗</button>
        <button class="sb" data-s="question" title="Question">❓</button>
    </div>

    <script>window.BOARDGAME_BASE = '..';</script>
    <script src="../shared/scripts/firebase-loader.js"></script>
    <script defer src="../shared/scripts/hex-image-preloader.js"></script>
    <script>
    const STATUS_KEYS = ['eating', 'smoking', 'wc', 'sleeping', 'alert', 'question'];
    const params = new URLSearchParams(window.location.search);
    const tournamentId = params.get('tournamentId') || params.get('tournament');
    const playerId = params.get('player');
    let onboardingRef = null;
    let currentStatuses = {};

    document.addEventListener('firebase-ready', () => {
        if (!tournamentId || !playerId) return;
        const db = window.firebaseDB;
        onboardingRef = db.collection('tournaments').doc(tournamentId)
            .collection('onboarding').doc('state');

        // Listen for real-time updates
        window.firebaseOnSnapshot(onboardingRef, (snap) => {
            if (!snap.exists) return;
            const data = snap.data();
            currentStatuses = data?.players?.[playerId]?.statuses || {};
            renderButtons();
        });
    });

    function renderButtons() {
        document.querySelectorAll('.sb').forEach(btn => {
            btn.classList.toggle('active', !!currentStatuses[btn.dataset.s]);
        });
    }

    document.getElementById('grid').addEventListener('click', (e) => {
        const btn = e.target.closest('.sb');
        if (!btn || !onboardingRef) return;
        const key = btn.dataset.s;
        const wasActive = !!currentStatuses[key];

        // Exclusive: clear all, then set if toggling on
        const updates = {};
        for (const k of STATUS_KEYS) {
            updates[`players.${playerId}.statuses.${k}`] = false;
        }
        if (!wasActive) {
            updates[`players.${playerId}.statuses.${key}`] = true;
        }
        updates[`players.${playerId}.lastUpdated`] = new Date().toISOString();

        onboardingRef.update(updates).catch(err => console.error('Save failed:', err));
    });
    </script>
</body>
</html>
