<!-- Admin Panel Module -->
<!-- This content is loaded into app.html content area -->
<!-- Dynamically loads tab content from separate module files -->

<style>
/* Tab Panel Visibility */
.god-tab-panel {
  display: none;
}
.god-tab-panel.active {
  display: block;
  animation: fadeIn 0.3s ease-in;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* God Nav Tabs */
.god-nav {
  display: flex;
  gap: 5px;
  padding: 10px 20px;
  background: rgba(15, 23, 42, 0.5);
  border-radius: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.god-nav-tab {
  padding: 10px 16px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  color: #94a3b8;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 500;
  transition: all 0.2s;
}
.god-nav-tab:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #f1f5f9;
}
.god-nav-tab.active {
  background: rgba(247, 186, 50, 0.15);
  border-color: rgba(247, 186, 50, 0.3);
  color: #ffd700;
}

/* Panel styling */
.panel {
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}
</style>

<div id="connectionStatus" class="connection-status disconnected" title="Firebase: Connecting..."></div>

<div class="container">
  <div class="header" style="padding: 12px 30px;">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div style="display: flex; align-items: center; gap: 15px;">
        <div>
          <h1 style="margin: 0; font-size: 1.5rem; color: #f7f0e3 !important; background: none !important; -webkit-text-fill-color: #f7f0e3 !important;">
            👑 God Mode - Tournament Admin
          </h1>
          <div id="currentTournamentIndicator" style="font-size: 0.75rem; color: #ffd700; margin-top: 4px; display: none;">
            <span style="opacity: 0.7;">🏆 Tournament:</span> <strong id="currentTournamentName">None</strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="status-message" id="statusMessage"></div>

  <!-- Main Navigation Tabs -->
  <nav class="god-nav">
    <button class="god-nav-tab active" data-tab="tournaments" onclick="switchGodTab('tournaments')">
      🏆 Tournaments
    </button>
    <button class="god-nav-tab" data-tab="matches" onclick="switchGodTab('matches')">
      🎮 Matches
    </button>
    <button class="god-nav-tab" data-tab="board" onclick="switchGodTab('board')">
      🎯 Board
    </button>
    <button class="god-nav-tab" data-tab="teams" onclick="switchGodTab('teams')">
      👥 Teams
    </button>
    <button class="god-nav-tab" data-tab="users" onclick="switchGodTab('users')">
      👤 Users
    </button>
    <button class="god-nav-tab" data-tab="spells" onclick="switchGodTab('spells')">
      🔮 Spells
    </button>
    <button class="god-nav-tab" data-tab="stats" onclick="switchGodTab('stats')">
      📊 Stats
    </button>
    <button class="god-nav-tab" data-tab="history" onclick="switchGodTab('history')">
      📜 History
    </button>
  </nav>

  <!-- Tab Panel Container - Content loaded dynamically -->
  <div id="tabPanelContainer">
    <div id="tournamentsPanel" class="god-tab-panel active">
      <div class="panel" style="text-align: center; padding: 40px;">
        <p style="opacity: 0.7;">Loading tournaments...</p>
      </div>
    </div>
    <div id="matchesPanel" class="god-tab-panel">
      <div class="panel" style="text-align: center; padding: 40px;">
        <p style="opacity: 0.7;">Loading matches...</p>
      </div>
    </div>
    <div id="boardPanel" class="god-tab-panel">
      <div class="panel" style="text-align: center; padding: 40px;">
        <p style="opacity: 0.7;">Loading board...</p>
      </div>
    </div>
    <div id="teamsPanel" class="god-tab-panel">
      <div class="panel" style="text-align: center; padding: 40px;">
        <p style="opacity: 0.7;">Loading teams...</p>
      </div>
    </div>
    <div id="usersPanel" class="god-tab-panel">
      <div class="panel" style="text-align: center; padding: 40px;">
        <p style="opacity: 0.7;">Loading users...</p>
      </div>
    </div>
    <div id="spellsPanel" class="god-tab-panel">
      <div class="panel" style="text-align: center; padding: 40px;">
        <p style="opacity: 0.7;">Loading spells...</p>
      </div>
    </div>
    <div id="statsPanel" class="god-tab-panel">
      <div class="panel" style="text-align: center; padding: 40px;">
        <p style="opacity: 0.7;">Loading stats...</p>
      </div>
    </div>
    <div id="historyPanel" class="god-tab-panel">
      <div class="panel" style="text-align: center; padding: 40px;">
        <p style="opacity: 0.7;">Loading history...</p>
      </div>
    </div>
  </div>
</div>

<!-- Modals (loaded once) -->
<div id="editTournamentModal" class="modal" style="display: none;">
  <div class="modal-content" style="max-width: 800px; max-height: 90vh; overflow-y: auto;">
    <div class="modal-header">
      <h2>Edit Tournament</h2>
      <button onclick="closeEditModal()" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">x</button>
    </div>
    <div class="modal-body" id="editTournamentForm">
      <!-- Form will be populated dynamically -->
    </div>
  </div>
</div>

<div id="userManagementModal" class="modal" style="display: none;">
  <div class="modal-content" style="max-width: 600px;">
    <div class="modal-header">
      <h2 id="userModalTitle">Create User</h2>
      <button onclick="closeUserModal()" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">x</button>
    </div>
    <div class="modal-body">
      <form id="userForm" onsubmit="saveUser(event)">
        <input type="hidden" id="userFormUid" value="">
        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" id="userFormEmail" required style="width: 100%; padding: 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; border-radius: 8px; color: white;">
        </div>
        <div class="form-group">
          <label>Display Name *</label>
          <input type="text" id="userFormDisplayName" required style="width: 100%; padding: 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; border-radius: 8px; color: white;">
        </div>
        <div class="form-group" id="passwordGroup">
          <label>Password *</label>
          <input type="password" id="userFormPassword" required minlength="6" placeholder="Minimum 6 characters" style="width: 100%; padding: 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; border-radius: 8px; color: white;">
          <small style="color: rgba(255, 255, 255, 0.6); font-size: 0.85rem;">Minimum 6 characters</small>
        </div>
        <div class="form-group">
          <label>Role *</label>
          <select id="userFormRole" required style="width: 100%; padding: 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; border-radius: 8px; color: white;">
            <option value="user">User (Default)</option>
            <option value="player">Player</option>
            <option value="admin">Admin</option>
            <option value="god">God (Full Access)</option>
          </select>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="userFormEnabled" checked> Account Enabled</label>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="submit" class="btn primary" style="flex: 1;">Save User</button>
          <button type="button" class="btn" onclick="closeUserModal()" style="flex: 1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Admin panel initialization script -->
<script>
(function() {
  'use strict';

  let db, auth;
  let currentTab = 'tournaments';
  let loadedTabs = new Set(); // Track which tabs have been loaded

  // Get the current tournament ID and name from sessionStorage (set by app-router)
  // Expose as global variable for god-scripts.js
  window.currentGameId = sessionStorage.getItem('currentGameId') || null;
  window.currentGameName = sessionStorage.getItem('currentGameName') || null;

  // Module paths for each tab
  const TAB_MODULES = {
    tournaments: 'modules/god-tournaments.html',
    matches: 'modules/god-matches.html',
    board: 'modules/god-board.html',
    teams: 'modules/god-teams.html',
    users: 'modules/god-users.html',
    spells: 'modules/god-spells.html',
    stats: 'modules/god-stats.html',
    history: 'modules/god-history.html'
  };

  // Tab switching - expose globally
  window.switchGodTab = async function(tabName) {
    console.log('[AdminPanel] Switching to tab:', tabName);
    currentTab = tabName;

    // Update tab buttons
    document.querySelectorAll('.god-nav-tab').forEach(btn => {
      btn.classList.remove('active');
      if (btn.getAttribute('data-tab') === tabName) {
        btn.classList.add('active');
      }
    });

    // Update panels visibility
    document.querySelectorAll('.god-tab-panel').forEach(panel => {
      panel.classList.remove('active');
    });

    const panelId = tabName + 'Panel';
    const panel = document.getElementById(panelId);
    if (panel) {
      panel.classList.add('active');
      console.log('[AdminPanel] Activated panel:', panelId);

      // Load content if not already loaded
      if (!loadedTabs.has(tabName)) {
        await loadTabContent(tabName, panel);
      }

      // Call tab-specific initialization
      initializeTabContent(tabName);
    } else {
      console.warn('[AdminPanel] Panel not found:', panelId);
    }
  };

  // Load tab content from module file
  async function loadTabContent(tabName, panel) {
    const modulePath = TAB_MODULES[tabName];
    if (!modulePath) {
      console.error('[AdminPanel] No module path for tab:', tabName);
      return;
    }

    try {
      console.log('[AdminPanel] Loading module:', modulePath);
      const response = await fetch(modulePath);

      if (!response.ok) {
        throw new Error(`Failed to load module: ${response.status}`);
      }

      const html = await response.text();
      panel.innerHTML = html;
      loadedTabs.add(tabName);
      console.log('[AdminPanel] Module loaded successfully:', tabName);

    } catch (error) {
      console.error('[AdminPanel] Error loading module:', error);
      panel.innerHTML = `
        <div class="panel" style="border-color: var(--red-500); background: rgba(239, 68, 68, 0.1);">
          <h3 style="color: var(--red-500);">Error Loading Module</h3>
          <p>Failed to load ${tabName} module.</p>
          <p><strong>Error:</strong> ${error.message}</p>
          <p style="margin-top: 20px;">
            <a href="god.html#${tabName}" class="btn btn-primary">Open in Full God Mode</a>
          </p>
        </div>
      `;
    }
  }

  // Initialize tab-specific functionality after content is loaded
  function initializeTabContent(tabName) {
    console.log('[AdminPanel] Initializing tab content:', tabName);

    // Call appropriate initialization functions from god-scripts.js
    switch(tabName) {
      case 'tournaments':
        // Load tournament list - retry if function not ready yet (race condition with god-scripts.js)
        let tournamentsRetries = 0;
        const loadTournaments = () => {
          if (typeof window.loadTournamentList === 'function') {
            console.log('[AdminPanel] Loading tournament list');
            window.loadTournamentList();
          } else if (tournamentsRetries < 10) {
            tournamentsRetries++;
            console.log('[AdminPanel] loadTournamentList not ready, retrying...', tournamentsRetries);
            setTimeout(loadTournaments, 200);
          } else {
            console.error('[AdminPanel] loadTournamentList never became available');
          }
        };
        loadTournaments();
        break;
      case 'matches':
        // If tournament is selected, auto-fill the game ID and load it
        if (window.currentGameId) {
          const gameIdInput = document.getElementById('gameId');
          if (gameIdInput) {
            gameIdInput.value = window.currentGameId;
            // Auto-load the game data - retry if function not ready yet
            let matchesRetries = 0;
            const loadMatches = () => {
              if (typeof window.loadGame === 'function') {
                console.log('[AdminPanel] Auto-loading game:', window.currentGameId);
                window.loadGame();
              } else if (matchesRetries < 10) {
                matchesRetries++;
                setTimeout(loadMatches, 200);
              }
            };
            loadMatches();
          }
        }
        break;
      case 'board':
        // Auto-load tournament if selected and gameState is not set for this tournament
        if (window.currentGameId && (!window.gameState || window.gameState.tournamentId !== window.currentGameId)) {
          if (typeof window.loadTournamentDirectly === 'function') {
            console.log('[AdminPanel] Auto-loading tournament for board:', window.currentGameId);
            window.loadTournamentDirectly(window.currentGameId);
          }
        }
        if (typeof window.initializeBoardModules === 'function') {
          window.initializeBoardModules();
        }
        if (typeof window.renderBoard === 'function' && window.gameState) {
          window.renderBoard();
        }
        break;
      case 'teams':
        // Auto-fill tournament ID for teams and load
        if (window.currentGameId) {
          const teamMgmtInput = document.getElementById('teamMgmtGameId');
          if (teamMgmtInput) {
            teamMgmtInput.value = window.currentGameId;
            // Auto-load the tournament for team management
            if (typeof window.loadTournamentForAppointment === 'function') {
              console.log('[AdminPanel] Auto-loading tournament for teams:', window.currentGameId);
              window.loadTournamentForAppointment(window.currentGameId);
            }
          }
        }
        break;
      case 'users':
        if (typeof window.loadUsers === 'function') {
          window.loadUsers();
        }
        break;
      case 'spells':
        // Auto-load tournament if needed
        if (window.currentGameId && (!window.gameState || window.gameState.tournamentId !== window.currentGameId)) {
          if (typeof window.loadTournamentDirectly === 'function') {
            console.log('[AdminPanel] Auto-loading tournament for spells:', window.currentGameId);
            window.loadTournamentDirectly(window.currentGameId);
          }
        } else if (typeof window.loadSpellCards === 'function' && window.gameState) {
          window.loadSpellCards();
        }
        break;
      case 'stats':
        // Auto-load tournament if needed
        if (window.currentGameId && (!window.gameState || window.gameState.tournamentId !== window.currentGameId)) {
          if (typeof window.loadTournamentDirectly === 'function') {
            console.log('[AdminPanel] Auto-loading tournament for stats:', window.currentGameId);
            window.loadTournamentDirectly(window.currentGameId);
          }
        } else if (typeof window.updateStats === 'function' && window.gameState) {
          window.updateStats();
        }
        break;
      case 'history':
        // Auto-load tournament if needed
        if (window.currentGameId && (!window.gameState || window.gameState.tournamentId !== window.currentGameId)) {
          if (typeof window.loadTournamentDirectly === 'function') {
            console.log('[AdminPanel] Auto-loading tournament for history:', window.currentGameId);
            window.loadTournamentDirectly(window.currentGameId);
          }
        } else if (typeof window.updateHistoryDisplay === 'function' && window.gameState) {
          window.updateHistoryDisplay();
        }
        break;
    }
  }

  // Initialize when Firebase is ready
  function onFirebaseReady() {
    console.log('[AdminPanel] Firebase ready, initializing...');
    auth = firebase.auth();
    db = firebase.firestore();

    // Check authentication
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = '../index.html';
        return;
      }

      // Initialize the panel
      initAdminPanel();
    });
  }

  // Check if Firebase is already initialized (event already fired before this module loaded)
  if (window.firebaseDB) {
    console.log('[AdminPanel] Firebase already initialized, starting immediately');
    onFirebaseReady();
  } else {
    // Wait for Firebase
    console.log('[AdminPanel] Waiting for firebase-ready event...');
    document.addEventListener('firebase-ready', onFirebaseReady);
  }

  function initAdminPanel() {
    console.log('[AdminPanel] Initializing admin panel');

    // Update tournament indicator if a tournament is selected
    if (window.currentGameId) {
      console.log('[AdminPanel] Active tournament:', window.currentGameId, window.currentGameName);
      const indicator = document.getElementById('currentTournamentIndicator');
      const nameEl = document.getElementById('currentTournamentName');
      if (indicator && nameEl) {
        // Show name if available, otherwise show ID
        nameEl.textContent = window.currentGameName || window.currentGameId;
        indicator.style.display = 'block';
      }
    }

    // Load initial tab (from sessionStorage if available)
    const savedHash = sessionStorage.getItem('adminPanelHash');
    console.log('[AdminPanel] Saved hash from sessionStorage:', savedHash);

    if (savedHash) {
      sessionStorage.removeItem('adminPanelHash');
      switchGodTab(savedHash);
    } else {
      // Default to tournaments tab
      switchGodTab('tournaments');
    }
  }

})();
</script>
