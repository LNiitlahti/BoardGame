<!DOCTYPE html>
<html lang="en">
<!--
    ============================================================================
    SEASON-STATS.HTML (full) - SEASON-WIDE STANDINGS & STATISTICS
    ============================================================================

    PURPOSE:
    Aggregates team standings across every tournament linked to a season
    (season.tournamentIds[]) into one combined leaderboard. Natural extension
    of statistics.html — same visual language, same standings math (via the
    shared team-standings.js helper), scoped to a season instead of a single
    tournament.

    Teams don't have a persistent id across tournaments (each tournament
    creates its own teams array from scratch) — season standings match teams
    across tournaments by NAME. See season-stats.js for how name collisions
    within a single tournament are kept from being merged together.

    USAGE:
    - URL parameter: full/season-stats.html?seasonId=xxx
    - Or pick a season from the dropdown (defaults to the active/most recent
      season, same fallback home.html's season panel uses)

    ACCESS:
    Public - no authentication required beyond what statistics.html requires.
    ============================================================================
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Game - Season Statistics</title>

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="../shared/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../shared/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../shared/images/favicon/favicon-16x16.png">
    <link rel="shortcut icon" href="../shared/images/favicon/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Quantico:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../shared/css/brand-theme.css">
    <link rel="stylesheet" href="../shared/css/navbar.css">
    <link rel="stylesheet" href="../shared/css/toast.css">
    <link rel="stylesheet" href="../shared/css/void-gold-theme.css">
    <!-- Reuses statistics.html's theme/card/table language so this reads as
         the same page family, not a new design system. -->
    <link rel="stylesheet" href="css/statistics.css">
    <link rel="stylesheet" href="css/season-stats.css">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <div>Loading season data...</div>
        </div>
    </div>

    <!-- Navbar (populated by shared navbar.js) -->
    <div id="navbar-container"></div>
    <script defer src="../shared/scripts/navbar.js"></script>

    <div class="stats-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="tournament-selector season-selector">
                <select id="seasonSelect" onchange="onSeasonSelect(this.value)">
                    <option value="">Select a season...</option>
                </select>
                <a class="btn secondary" href="statistics.html">Single-Tournament Stats</a>
            </div>

            <div class="tournament-meta" id="seasonMeta">
                <span class="meta-item">Status: <strong id="metaSeasonStatus">--</strong></span>
                <span class="meta-item">Tournaments: <strong id="metaSeasonTournaments">--</strong></span>
            </div>
        </div>

        <div id="seasonWarnings" class="season-warnings" style="display:none;"></div>

        <div class="overview-grid">
            <!-- Season Standings -->
            <section class="stats-card standings-card season-standings-card">
                <h3>Season Standings</h3>
                <div class="standings-table" id="seasonStandingsTable">
                    <p class="no-data">Select a season to view combined standings</p>
                </div>
            </section>

            <!-- Season Summary -->
            <section class="stats-card summary-card">
                <h3>Season Summary</h3>
                <div class="summary-stats" id="seasonSummaryStats">
                    <div class="summary-item">
                        <span class="summary-label">Tournaments</span>
                        <span class="summary-value" id="seasonSummaryTournaments">--</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Total Matches</span>
                        <span class="summary-value" id="seasonSummaryMatches">--</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Total Rounds</span>
                        <span class="summary-value" id="seasonSummaryRounds">--</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Avg Match Duration</span>
                        <span class="summary-value" id="seasonSummaryAvgDuration">--</span>
                    </div>
                </div>
            </section>

            <!-- Per-Tournament Breakdown -->
            <section class="stats-card tournament-breakdown-card">
                <h3>Tournaments In This Season</h3>
                <div class="tournament-breakdown-table" id="tournamentBreakdownTable">
                    <p class="no-data">Select a season to view its tournaments</p>
                </div>
            </section>
        </div>
    </div>

    <!-- Scripts -->
    <script>window.BOARDGAME_BASE = '..';</script>
    <script defer src="../shared/scripts/firebase-loader.js"></script>
    <script defer src="../shared/scripts/config.js"></script>
    <script defer src="../shared/scripts/toast.js"></script>
    <script defer src="../shared/scripts/team-standings.js"></script>
    <script defer src="scripts/season-stats.js"></script>
</body>
</html>
