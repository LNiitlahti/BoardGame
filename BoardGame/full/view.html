    <!-- Not deferred: the inline block below reads resolveTournamentId()
         synchronously at parse time, before deferred scripts would run. -->
    <script src="../shared/scripts/resolve-tournament-id.js"></script>

    <script>
    // ====================================================================
    // VIEW-FULL V2 — Firebase Integration + DisplayManager
    // ====================================================================

    let gameState = null;
    let boardModule = null;
    let boardRenderer = null;
    let activeListener = null;
    let resultLogListener = null;
    let onboardingListener = null;
    let onboardingState = null;
    let resultLogCache = [];

    const tournamentId = resolveTournamentId({
        search: window.location.search,
        paramNames: ['tournamentId'],
        legacyParamNames: ['tournament', 'gameId'],
        cached: sessionStorage.getItem('currentTournamentId') || localStorage.getItem('currentTournamentId')
    });

    // Team color defaults (maps to CSS variables --t1 through --t5)
    const TEAM_COLORS = {
        1: '#de392c',
        2: '#2278a3',
        3: '#2e9158',
        4: '#f7ba32',
        5: '#7a4fbf'
    };

    // ====================================================================
    // HEX BOARD RENDERER
    // ====================================================================

    function initBoard() {
        const hexBoardContainer = document.getElementById('hexBoard');
        if (!hexBoardContainer) return;

        // Initialize board at 1.5x resolution for better quality when scaled down
        boardModule = new BoardModule(1.5);
        boardRenderer = new BoardRenderer(hexBoardContainer, boardModule, {
            responsive: true,
            showHeartImages: true,
            hexScale: 1.5
        });
        boardRenderer.render({});

        // Apply visual effects
        applyInitialEffects();
    }

    function renderBoard() {
        // Cinematic: while active, defer re-renders (a render wipes per-hex
        // inline transforms mid-cascade). Controller flushes on finish/skip.
        if (window.CINEMATIC && window.CINEMATIC.shouldDeferRenders()) {
            window.CINEMATIC.queueRender();
            return;
        }
        if (!boardRenderer || !boardModule) return;

        // Load room hexes into board module if available
        if (gameState?.rooms && boardModule) {
            boardModule.setRoomHexes(gameState.rooms);
        }

        boardRenderer.render(gameState || {});

        // Add team colors to hexes based on board state
        const hexes = document.querySelectorAll('.board-hex');
        hexes.forEach(hex => {
            const coord = hex.dataset.coord;

            // Remove old team classes
            hex.classList.remove('team-1', 'team-2', 'team-3', 'team-4', 'team-5');

            // Add team color class if hex is controlled
            if (gameState?.board && gameState.board[coord]) {
                const teamId = gameState.board[coord];
                hex.classList.add(`team-${teamId}`);
            }
        });

        // Cinematic: announce data-driven renders so the controller can arm.
        if (window.CINE_MODE) {
            window.__cineHadRender = true; // race guard: set even if no listener is attached yet
            document.dispatchEvent(new CustomEvent('view-board-rendered', {
                detail: { hasData: !!gameState }
            }));
        }
    }

    // Bridge for the cinematic controller (script-scoped lets are not globals).
    window.CineView = {
        renderBoard: () => renderBoard(),
        getBoardModule: () => boardModule,
        getGameState: () => gameState
    };

    /**
     * Apply hex terrain images dynamically via CSS
     */
    function applyHexImages(enabled) {
        let styleEl = document.getElementById('hex-images-dynamic-css');

        if (!enabled) {
            if (styleEl) styleEl.remove();
            return;
        }

        if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = 'hex-images-dynamic-css';
            document.head.appendChild(styleEl);
        }

        // Generate CSS rules for each hex coordinate
        const hexCoords = boardModule.generateHexCoordinates();
        let css = '';

        hexCoords.forEach(([q, r]) => {
            const coord = `q${q}r${r}`;
            css += `body.effect-hex-images .board-hex[data-coord="${coord}"]::before {
                background-image: url('../shared/images/hexes/coords/${coord}.png');
            }\n`;
        });

        styleEl.textContent = css;
    }

    /**
     * Apply all visual effects (always enabled for display view)
     */
    function applyInitialEffects() {
        // Enable all visual effects for display view
        document.body.classList.add('effect-hex-images');
        document.body.classList.add('effect-heart-glow');
        document.body.classList.add('effect-pulse-hearts');
        document.body.classList.add('effect-rooms');

        // Apply hex terrain images
        applyHexImages(true);
    }

    // ====================================================================
    // CLOCK & MATCH TIMERS
    // ====================================================================

    function updateClock() {
        document.getElementById('clock').textContent =
            new Date().toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
    }

    // Track match start times for elapsed timers
    let matchStartTimes = { match1: null, match2: null };

    // Cache for diff-based rendering (avoid unnecessary innerHTML rebuilds)
    let prevArenaSignatures = { match1: null, match2: null };
    let prevQueueSignature = null;
    let prevResultIds = [];

    function getMatchSignature(match) {
        if (!match) return null;
        // Use only stable structural fields — avoids false diffs from
        // Firebase Timestamp object re-serialization on each snapshot
        const parts = [
            match.id,
            match.matchNumber,
            match.game,
            match.playType,
            match.status,
            match.winningSide || '',
            match.isBreak ? 'break' : '',
            match.breakLabel || '',
        ];
        if (match.teams) {
            match.teams.forEach(t => {
                parts.push(t.id);
                parts.push((t.playerIds || []).join(','));
            });
        }
        return parts.join('|');
    }

    function updateMatchTimers() {
        const fmt = s => {
            const secs = Math.floor(s);
            return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
        };

        const now = Date.now();

        ['match1', 'match2'].forEach((matchId, idx) => {
            const el = document.getElementById(`elapsed${idx + 1}`);
            if (el && matchStartTimes[matchId]) {
                const elapsed = (now - matchStartTimes[matchId]) / 1000;
                el.textContent = fmt(elapsed);
            }
        });
    }

    // ====================================================================
    // FIREBASE LISTENER
    // ====================================================================

    // Diff guard: skip re-renders when only irrelevant fields changed
    let prevViewSignature = null;
    const VIEW_EXCLUDED_KEYS = ['onboarding', 'smartMatchState'];

    function getViewRelevantSignature(data) {
        const parts = [];
        for (const key of Object.keys(data).sort()) {
            if (VIEW_EXCLUDED_KEYS.includes(key)) continue;
            try { parts.push(key + ':' + JSON.stringify(data[key])); }
            catch { parts.push(key + ':' + String(data[key])); }
        }
        return parts.join('|');
    }

    function setupTournamentListener() {
        if (!tournamentId) {
            console.warn('No tournament ID provided');
            return;
        }

        const db = window.firebaseDB;
        if (!db) {
            console.error('Firebase database not available');
            return;
        }

        const tournamentRef = db.collection('tournaments').doc(tournamentId);

        activeListener = window.firebaseOnSnapshot(tournamentRef, (docSnapshot) => {
            if (docSnapshot.exists) {
                const newData = docSnapshot.data();
                const newSig = getViewRelevantSignature(newData);

                gameState = newData;
                gameState.tournamentId = tournamentId;

                if (newSig !== prevViewSignature) {
                    prevViewSignature = newSig;
                    updateDisplay();
                }
            } else {
                console.warn('Tournament not found:', tournamentId);
            }
        }, (error) => {
            console.error('Listener error:', error);
        });

        // Set up result log listener
        setupResultLogListener();
    }

    function setupResultLogListener() {
        if (!tournamentId) return;

        const db = window.firebaseDB;
        if (!db) return;

        if (resultLogListener) {
            resultLogListener();
            resultLogListener = null;
        }

        const resultLogRef = db.collection('tournaments')
            .doc(tournamentId)
            .collection('eventLog')
            .orderBy('timestamp', 'desc')
            .limit(30);

        resultLogListener = window.firebaseOnSnapshot(resultLogRef, (snapshot) => {
            resultLogCache = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                data.id = doc.id;
                if (data.timestamp?.toDate) {
                    data.timestamp = data.timestamp.toDate();
                }
                if (data.type === 'game_win' || data.type === 'match_complete') {
                    resultLogCache.push(data);
                }
            });
            updateDisplay();
        }, (error) => {
            console.error('Result log listener error:', error);
        });
    }

    // ====================================================================
    // ONBOARDING STATUS LISTENER
    // ====================================================================

    const STATUS_EMOJIS = {
        eating: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:#f97316"><path d="m12 14-1 1"/><path d="m13.75 18.25-1.25 1.42"/><path d="M17.775 5.654a15.68 15.68 0 0 0-12.121 12.12"/><path d="M18.8 9.3a1 1 0 0 0 2.1 7.7"/><path d="M21.964 20.732a1 1 0 0 1-1.232 1.232l-18-5a1 1 0 0 1-.695-1.232A19.68 19.68 0 0 1 15.732 2.037a1 1 0 0 1 1.232.695z"/></svg>',
        smoking: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:#fef9c3"><path d="M17 12H3a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h14"/><path d="M18 8c0-2.5-2-2.5-2-5"/><path d="M21 16a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M22 8c0-2.5-2-2.5-2-5"/><path d="M7 12v4"/></svg>',
        wc: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:#9ca3af"><path d="M7 12h13a1 1 0 0 1 1 1 5 5 0 0 1-5 5h-.598a.5.5 0 0 0-.424.765l1.544 2.47a.5.5 0 0 1-.424.765H5.402a.5.5 0 0 1-.424-.765L7 18"/><path d="M8 18a5 5 0 0 1-5-5V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8"/></svg>',

        question: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:#f59e0b"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>'
    };

    function setupOnboardingListener() {
        if (!tournamentId) return;
        const db = window.firebaseDB;
        if (!db) return;

        const onboardingRef = db.collection('tournaments').doc(tournamentId)
            .collection('onboarding').doc('state');

        onboardingListener = window.firebaseOnSnapshot(onboardingRef, (docSnapshot) => {
            onboardingState = docSnapshot.exists ? docSnapshot.data() : null;
            renderStatusStrip();
        }, (error) => {
            console.error('Onboarding listener error:', error);
        });
    }

    function renderStatusStrip() {
        const strip = document.getElementById('statusStrip');
        if (!strip) return;

        const teams = gameState?.teams || [];
        const players = onboardingState?.players || {};
        const items = [];

        // Iterate teams and look up onboarding data by real player ID
        for (const team of teams) {
            for (const p of (team.players || [])) {
                if (!p.id) continue;
                const pData = players[p.id] || {};
                const statuses = pData.statuses || {};
                const activeEmojis = Object.entries(STATUS_EMOJIS)
                    .filter(([key]) => statuses[key])
                    .map(([, emoji]) => emoji)
                    .join('');
                if (activeEmojis) {
                    items.push(`<span class="ss-item"><span class="ss-emoji">${activeEmojis}</span><span class="ss-name">${p.name || 'Player'}</span></span>`);
                }
            }
        }

        if (items.length > 0) {
            strip.innerHTML = items.join('');
            strip.classList.add('visible');
        } else {
            strip.classList.remove('visible');
            strip.innerHTML = '';
        }
    }

    // ====================================================================
    // DISPLAY UPDATES — Delegated to DisplayManager
    // ====================================================================

    let displayManager = null;

    function initDisplayManager() {
        displayManager = new DisplayManager({
            container: document.body,
            boardModule: boardModule,
            boardRenderer: boardRenderer,
            // Provide board render callback for hex team coloring
            renderBoard: renderBoard,
            // Provide result log cache access
            getResultLogCache: () => resultLogCache,
            getOnboardingState: () => onboardingState,
            // Provide match start times ref for elapsed timer tracking
            matchStartTimes: matchStartTimes,
            // Provide diff state
            prevArenaSignatures: prevArenaSignatures,
            prevQueueSignature: { value: null },
            prevResultIds: { value: [] }
        });
        displayManager.setTournamentId(tournamentId);
    }

    function updateDisplay() {
        if (!gameState) return;
        if (!displayManager) initDisplayManager();
        displayManager.onFirebaseSnapshot(gameState);
    }

    // Note: applyTeamColors, renderScoreBars, renderMatches, renderArenaMatch,
    // renderQueue, buildResultCardHTML, renderResults, renderScoreStrip,
    // and all utility functions (getGameDisplayName, getTeamColor, etc.)
    // have been moved into DisplayManager for the full version.
    // The lightweight version keeps them inline.

    // formatTimeAgo is still needed by result log rendering in DM
    function formatTimeAgo(date) {
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        if (diffMins < 1) return 'Just now';
        if (diffMins === 1) return '1 min ago';
        if (diffMins < 60) return `${diffMins} min ago`;
        const diffHours = Math.floor(diffMins / 60);
        if (diffHours === 1) return '1h ago';
        if (diffHours < 24) return `${diffHours}h ago`;
        return date.toLocaleDateString('fi-FI');
    }

    // getMatchSignature is still needed for diff-based rendering
    // (already defined above in the CLOCK section)

    // Expose for DisplayManager
    window.formatTimeAgo = formatTimeAgo;
    window.TEAM_COLORS = TEAM_COLORS;

    // ====================================================================
    // MATCH TRANSITION API (keep for future use)
    // ====================================================================

    const TIMING = {
        OVERLAY_DURATION: 3500,      // Match the slower overlay animation
        MATCH_FADE_COMPLETE: 6000,   // Match the 5s match-finish animation
        QUEUE_REMOVE_DELAY: 2000,    // Match the 2s queue-promote-out animation
        PROMOTE_SETTLE: 5000,        // Match the 4s match-promote animation
    };

    function endMatch(matchId, winningSide, onComplete) {
        const matchEl = document.getElementById(matchId);
        if (!matchEl) return;

        const overlay = matchEl.querySelector('.match-complete-overlay');
        const winSide = matchEl.querySelector(`.a-side.${winningSide}`);

        if (winSide) winSide.classList.add('win-flash');
        if (overlay) overlay.classList.add('active');

        setTimeout(() => {
            matchEl.classList.add('finishing');
        }, TIMING.OVERLAY_DURATION);

        setTimeout(() => {
            if (onComplete) onComplete();
        }, TIMING.MATCH_FADE_COMPLETE);
    }

    // ====================================================================
    // INIT
    // ====================================================================

    document.addEventListener('DOMContentLoaded', () => {
        initBoard();
        updateClock();
        setInterval(updateClock, 1000);
        setInterval(updateMatchTimers, 1000);

        if (!tournamentId) {
            sessionStorage.setItem('homeNotice', 'No tournament selected. Pick a tournament below to spectate.');
            window.location.href = 'home.html';
            return;
        }
    });

    document.addEventListener('firebase-ready', () => {
        setupTournamentListener();
        setupOnboardingListener();
    });

    // Clean up Firebase listeners on page unload to prevent zombie callbacks
    window.addEventListener('beforeunload', () => {
        if (activeListener) { activeListener(); activeListener = null; }
        if (resultLogListener) { resultLogListener(); resultLogListener = null; }
        if (onboardingListener) { onboardingListener(); onboardingListener = null; }
    });
    </script>

    <!-- Ember particle system -->
    <script>
    (function() {
        const field = document.getElementById('emberField');
        const MAX_EMBERS = 120; // Cap DOM nodes to prevent memory creep over hours
        let ct = 0;

        function spawnEmber() {
            // Skip if at capacity — oldest embers auto-remove via setTimeout
            if (field.childElementCount >= MAX_EMBERS) return;

            const e = document.createElement('div');
            ct++;
            const type = ct % 12 === 0 ? 'spark' : ct % 4 === 0 ? 'bright' : '';
            e.className = 'ember' + (type ? ' ' + type : '');

            e.style.left = (960 + (Math.random() - 0.5) * 1400) + 'px';
            e.style.bottom = (-10 + Math.random() * 80) + 'px';
            const dur = type === 'spark' ? 6 + Math.random() * 6 : 10 + Math.random() * 12;
            e.style.animationDuration = dur + 's';
            e.style.animationDelay = (Math.random() * 1.5) + 's';
            const size = type === 'spark' ? 1.5 + Math.random() * 2 : 2 + Math.random() * 3;
            e.style.width = size + 'px';
            e.style.height = size + 'px';

            field.appendChild(e);
            setTimeout(() => { if (e.parentNode) e.remove(); }, 26000);
        }

        setInterval(spawnEmber, 150);
        for (let i = 0; i < 25; i++) setTimeout(spawnEmber, i * 60);
    })();
    </script>
