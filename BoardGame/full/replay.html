<!DOCTYPE html>
<html lang="en">
<!--
    ============================================================================
    REPLAY.HTML - POST-TOURNAMENT REPLAY VIEWER
    ============================================================================

    PURPOSE:
    Replays a completed tournament step-by-step using the action log and backup
    snapshots. Shows board state, standings, and action descriptions at any point
    in the tournament timeline.

    CHARACTERISTICS:
    - Read-only (no writes to Firestore)
    - Uses backup snapshots as keyframes + forward-applies action log entries
    - Timeline slider, play/pause, speed controls, round jumping
    - Summary modal with post-tournament analytics
    - JSON/CSV export of action log

    USAGE:
    replay.html?tournamentId=xxx

    ============================================================================
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Game - Replay</title>

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="../shared/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../shared/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../shared/images/favicon/favicon-16x16.png">
    <link rel="manifest" href="../shared/images/favicon/site.webmanifest">
    <link rel="shortcut icon" href="../shared/images/favicon/favicon.ico">

    <!-- Fonts: Russo One (titles) + Quantico (body) — same as the rest of the suite -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Quantico:wght@400;700&display=swap" rel="stylesheet">

    <!-- void-gold-theme.css must load AFTER brand-theme.css so its variable
         overrides win. dark-theme.css is deliberately NOT loaded: every rule in
         it is scoped to `body.dark-mode`, which this page never sets, so it was
         dead weight that only made the page look themed. -->
    <link rel="stylesheet" href="../shared/css/brand-theme.css">
    <link rel="stylesheet" href="../shared/css/void-gold-theme.css">
    <link rel="stylesheet" href="../shared/css/navbar.css">
    <link rel="stylesheet" href="../shared/css/toast.css">
    <link rel="stylesheet" href="css/replay.css">
</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-title">Loading Tournament Replay</div>
    <div class="loading-phase" id="loadingPhase">Connecting...</div>
    <div class="loading-bar">
        <div class="loading-bar-fill" id="loadingBarFill"></div>
    </div>
</div>

<!-- Error Overlay -->
<div class="error-overlay hidden" id="errorOverlay">
    <div class="error-icon">!</div>
    <div class="error-title" id="errorTitle">Error</div>
    <div class="error-message" id="errorMessage"></div>
    <button class="btn secondary" onclick="window.history.back()">Go Back</button>
</div>

<!-- Atmosphere Layers -->
<div class="atmo atmo-grad"></div>
<div class="atmo atmo-noise"></div>

<!-- Navbar container - populated by navbar.js.
     Note: navbar.js has no "Replay" destination on purpose. This page is
     reachable only from god.html's Open Replay button; the navbar is here so
     the page matches the suite and offers a way back out. -->
<div id="navbar-container"></div>
<script defer src="../shared/scripts/navbar.js"></script>

<!-- Main Page -->
<div class="replay-container">

    <!-- Header -->
    <div class="replay-header">
        <div class="tournament-name" id="tournamentName">Loading...</div>
        <div class="header-info">
            <span id="headerRound">Round --</span>
            <span class="replay-badge">Replay</span>
        </div>
    </div>

    <!-- No-Backup Warning (shown if needed) -->
    <div class="no-backup-warning hidden" id="noBackupWarning">
        Limited replay: no round-boundary backups available. Board reconstruction may be approximate.
    </div>

    <!-- Timeline Bar -->
    <div class="replay-timeline">
        <div class="timeline-markers" id="timelineMarkers"></div>
        <input type="range" class="timeline-slider" id="timelineSlider"
               min="0" max="0" value="0"
               oninput="onTimelineScrub(this.value)"
               onchange="onTimelineSeek(this.value)">
        <div class="timeline-info">
            <span id="timelinePosition">0 / 0</span>
            <span id="timelineTimestamp"></span>
        </div>
    </div>

    <!-- Controls Bar -->
    <div class="replay-controls">
        <div class="transport-btns">
            <button class="transport-btn" onclick="seekStart()" title="Go to start">|&lt;</button>
            <button class="transport-btn" onclick="stepBack()" title="Previous action">&lt;</button>
            <button class="transport-btn play-btn" id="playPauseBtn" onclick="togglePlay()">Play</button>
            <button class="transport-btn" onclick="stepFwd()" title="Next action">&gt;</button>
            <button class="transport-btn" onclick="seekEnd()" title="Go to end">&gt;|</button>
        </div>

        <div class="speed-controls">
            <button class="speed-btn active" data-speed="1" onclick="setSpeed(1)">1x</button>
            <button class="speed-btn" data-speed="2" onclick="setSpeed(2)">2x</button>
            <button class="speed-btn" data-speed="5" onclick="setSpeed(5)">5x</button>
            <button class="speed-btn" data-speed="10" onclick="setSpeed(10)">10x</button>
        </div>

        <div class="controls-separator"></div>

        <select class="round-jump-select" id="roundJump" onchange="jumpToRound(this.value)">
            <option value="">Jump to round...</option>
        </select>

        <div class="controls-right">
            <button class="btn secondary" onclick="openSummary()">Summary</button>
            <button class="btn secondary" onclick="exportJSON()">Export JSON</button>
            <button class="btn secondary" onclick="exportCSV()">Export CSV</button>
            <button class="btn secondary" id="exportVideoBtn" onclick="exportVideo()">Export Video</button>
        </div>
    </div>

    <!-- Video Export Status (shown only while a screen-recording export is in progress) -->
    <div class="video-export-status hidden" id="videoExportStatus">
        <span id="videoExportText">Recording…</span>
        <button class="btn secondary" onclick="cancelVideoExport()">Stop</button>
    </div>

    <!-- Main Content -->
    <div class="replay-main">

        <!-- Board Panel (left) -->
        <div class="board-panel">
            <div class="board-section">
                <div id="hexBoard" class="hex-board-container"></div>
            </div>
            <div class="standings-section" id="standingsPanel"></div>
        </div>

        <!-- Sidebar (right) -->
        <div class="replay-sidebar">
            <div class="action-feed-header">Action Log</div>
            <div class="action-feed" id="actionFeed"></div>
            <div class="info-panel" id="infoPanel">
                <div class="info-row">
                    <span class="info-label">Phase</span>
                    <span class="info-value" id="infoPhase">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Round</span>
                    <span class="info-value" id="infoRound">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Games Played</span>
                    <span class="info-value" id="infoGamesPlayed">0</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Status</span>
                    <span class="info-value" id="infoStatus">--</span>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Summary Modal -->
<div class="modal" id="summaryModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Tournament Summary</h3>
            <button class="modal-close" onclick="closeSummary()">&times;</button>
        </div>
        <div class="modal-body" id="summaryContent">
            <p style="color: var(--text-secondary)">Generating summary...</p>
        </div>
        <div class="modal-footer">
            <button class="btn secondary" onclick="exportSummaryJSON()">Export JSON</button>
            <button class="btn secondary" onclick="exportSummaryMarkdown()">Export Markdown</button>
            <button class="btn primary" onclick="closeSummary()">Close</button>
        </div>
    </div>
</div>

<!-- ===== Scripts ===== -->
<script>window.BOARDGAME_BASE = '..';</script>

<!-- Shared deps -->
<script defer src="../shared/scripts/firebase-loader.js"></script>
<script defer src="../shared/scripts/hex-image-preloader.js"></script>
<script defer src="../shared/scripts/board-module.js"></script>
<script defer src="../shared/scripts/board-renderer.js"></script>
<script defer src="../shared/scripts/games-config.js"></script>

<!-- Reused modules (static methods only) -->
<script defer src="scripts/action-logger.js"></script>

<!-- Phase 4 modules -->
<script defer src="scripts/replay-engine.js"></script>
<script defer src="scripts/summary-generator.js"></script>
<script defer src="scripts/action-export.js"></script>
<script src="../shared/scripts/resolve-tournament-id.js"></script>

<script>
    // ===== State =====
    let replayEngine = null;
    let summaryGen = null;
    let actionExport = null;
    let boardModule = null;
    let boardRenderer = null;

    const tournamentId = resolveTournamentId({
        search: window.location.search,
        paramNames: ['tournamentId'],
        legacyParamNames: ['tournament']
    });

    // ===== Initialization =====
    document.addEventListener('DOMContentLoaded', () => {
        if (!tournamentId) {
            showError('No Tournament', 'No tournament ID provided. Use ?tournamentId=xxx in the URL.');
            return;
        }

        boardModule = new BoardModule();
        boardRenderer = new BoardRenderer(
            document.getElementById('hexBoard'),
            boardModule,
            { responsive: true, showHeartImages: true }
        );

        // Board visuals are opt-in via body classes (same set team.html enables).
        // Without these the board renders as bare white hexes with the debug
        // coordinate labels showing.
        document.body.classList.add(
            'effect-hex-images', 'effect-heart-glow', 'effect-pulse-hearts', 'effect-rooms'
        );
        applyHexImages();
    });

    /**
     * Inject the per-coordinate hex artwork as a generated stylesheet.
     *
     * Board-state-independent — the same 91 rules every time — so it is built
     * once at startup rather than on every render. Ported from
     * team-controls.js applyHexImages(); admin.js and ui-manager.js carry their
     * own copies of the same routine.
     */
    function applyHexImages() {
        if (!boardModule) return;

        let styleEl = document.getElementById('hex-images-dynamic-css');
        if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = 'hex-images-dynamic-css';
            document.head.appendChild(styleEl);
        }

        const base = window.BOARDGAME_BASE || '.';
        styleEl.textContent = boardModule.generateHexCoordinates()
            .map(([q, r]) => {
                const coord = `q${q}r${r}`;
                return `body.effect-hex-images .board-hex[data-coord="${coord}"]::before {
                    background-image: url('${base}/shared/images/hexes/coords/${coord}.png');
                }`;
            })
            .join('\n');
    }

    /**
     * Plate colours come from `--team-N-alpha` CSS vars; replay.css only
     * carries fallback values (the old hardcoded palette), so without this
     * the board ignored the colours configured in Firebase. Fed from the
     * RECONSTRUCTED state, not the final doc, because team_color_changed
     * is a replayable action — colours can differ mid-timeline.
     */
    const LEGACY_TEAM_COLOR_MAP = {
        red: '#de392c', blue: '#2278a3', green: '#2e9158',
        orange: '#f7ba32', yellow: '#f7ba32', amber: '#f7ba32',
        purple: '#a855f7', pink: '#ec4899', teal: '#14b8a6',
        cyan: '#06b6d4', lime: '#84cc16', indigo: '#6366f1'
    };

    function teamHexColor(color) {
        if (!color) return null;
        if (color.startsWith('#')) return color;
        return LEGACY_TEAM_COLOR_MAP[color.toLowerCase()] || null;
    }

    function applyTeamColorVars(teams) {
        const root = document.documentElement;
        (teams || []).forEach(team => {
            const hexColor = teamHexColor(team.color);
            if (!hexColor) return;
            root.style.setProperty(`--team-${team.id}-color`, hexColor);
            const hex = hexColor.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            root.style.setProperty(`--team-${team.id}-alpha`, `rgba(${r}, ${g}, ${b}, 1)`);
        });
    }

    /**
     * BoardRenderer only writes `data-team` on occupied hexes; the colour ring
     * comes from a `team-N` class. Must run after every render.
     */
    function applyTeamColorsToBoard(board) {
        document.querySelectorAll('.board-hex').forEach(hex => {
            hex.classList.remove('team-1', 'team-2', 'team-3', 'team-4', 'team-5', 'team-6');
            const teamId = board?.[hex.dataset.coord];
            if (teamId) hex.classList.add(`team-${teamId}`);
        });
    }

    document.addEventListener('firebase-ready', async () => {
        if (!tournamentId) return;

        try {
            replayEngine = new ReplayEngine({
                getFirebaseDB: () => window.firebaseDB,
                tournamentId,
                onStateChanged: onReplayStateChanged,
                onLoadProgress: onLoadProgress
            });

            await replayEngine.loadTournamentData();

            // Create export utility
            actionExport = new ActionExport({
                getFirebaseDB: () => window.firebaseDB,
                tournamentId,
                actions: replayEngine.actions
            });

            // Setup UI
            setupUI();

            // Seek to beginning
            if (replayEngine.totalActions > 0) {
                replayEngine.seekToAction(replayEngine.minSequenceNumber);
            }

            // Hide loading
            document.getElementById('loadingOverlay').classList.add('hidden');

        } catch (err) {
            console.error('Replay load error:', err);
            showError('Load Error', err.message || 'Failed to load tournament data.');
        }
    });

    // ===== Loading Progress =====
    function onLoadProgress(phase, percent) {
        const phaseLabels = {
            tournament: 'Loading tournament...',
            backups: 'Loading backups...',
            actions: 'Loading action log...',
            timeline: 'Building timeline...'
        };
        document.getElementById('loadingPhase').textContent = phaseLabels[phase] || phase;
        document.getElementById('loadingBarFill').style.width = percent + '%';
    }

    // ===== UI Setup =====
    function setupUI() {
        // Header
        document.getElementById('tournamentName').textContent = replayEngine.tournamentName;
        document.title = `Replay: ${replayEngine.tournamentName}`;

        // Timeline slider
        const slider = document.getElementById('timelineSlider');
        slider.min = 0;
        slider.max = replayEngine.totalActions - 1;
        slider.value = 0;

        // Round markers
        renderTimelineMarkers();

        // Round jump dropdown
        populateRoundJump();

        // No-backup warning
        if (replayEngine.backups.length === 0) {
            document.getElementById('noBackupWarning').classList.remove('hidden');
        }

        // Pre-render action feed
        renderFullActionFeed();

        // Keyboard shortcuts
        document.addEventListener('keydown', onKeyDown);
    }

    function renderTimelineMarkers() {
        const container = document.getElementById('timelineMarkers');
        const total = replayEngine.totalActions;
        if (total === 0) return;

        const boundaries = replayEngine.roundBoundaries;
        container.innerHTML = boundaries.map(b => {
            const index = replayEngine._seqToIndex(b.startSeq);
            const percent = (index / (total - 1)) * 100;
            return `<div class="round-marker" style="left:${percent}%"
                         onclick="jumpToRound(${b.roundNumber})"
                         title="Round ${b.roundNumber}">R${b.roundNumber}</div>`;
        }).join('');
    }

    function populateRoundJump() {
        const select = document.getElementById('roundJump');
        const boundaries = replayEngine.roundBoundaries;
        select.innerHTML = '<option value="">Jump to round...</option>' +
            boundaries.map(b =>
                `<option value="${b.roundNumber}">Round ${b.roundNumber}</option>`
            ).join('');
    }

    // ===== Action Feed =====
    function renderFullActionFeed() {
        const feed = document.getElementById('actionFeed');
        const actions = replayEngine.actions;

        // Reconstruct a minimal gameState for describeAction name resolution
        const nameState = replayEngine.tournamentDoc;

        feed.innerHTML = actions.map((action, i) => {
            const badge = ActionLogger.categoryBadgeClass(action.category);
            const desc = ActionLogger.describeAction(action, nameState);
            const ts = formatTimestamp(action.timestamp);
            const undoneClass = action.undone ? ' undone' : '';

            return `<div class="action-entry${undoneClass}" id="action-${i}" onclick="seekToIndex(${i})">
                <span class="action-seq">#${action.sequenceNumber}</span>
                <span class="action-badge ${badge}">${action.category || ''}</span>
                <span class="action-desc">${escapeHtml(desc)}</span>
                <span class="action-time">${ts}</span>
            </div>`;
        }).join('');
    }

    function highlightCurrentAction(index) {
        // Remove old highlight
        const old = document.querySelector('.action-entry.current');
        if (old) old.classList.remove('current');

        // Add new highlight
        const el = document.getElementById(`action-${index}`);
        if (el) {
            el.classList.add('current');
            // Scroll into view
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
    }

    // ===== State Changed Callback =====
    function onReplayStateChanged(state, action, progress) {
        // Update board
        if (boardRenderer && state) {
            applyTeamColorVars(state.teams);
            boardRenderer.render({
                board: state.board || {},
                rooms: state.rooms || [],
                teams: state.teams || [],
                heartHexControl: state.heartHexControl || {}
            });
            applyTeamColorsToBoard(state.board);
        }

        // Update standings
        renderStandings(state);

        // Highlight action in feed
        highlightCurrentAction(progress.index);

        // Update timeline slider
        const slider = document.getElementById('timelineSlider');
        slider.value = progress.index;

        // Update timeline info
        document.getElementById('timelinePosition').textContent =
            `${progress.index + 1} / ${progress.total}`;
        document.getElementById('timelineTimestamp').textContent =
            action ? formatTimestamp(action.timestamp) : '';

        // Update header round. Round 0 is pre-game setup, not missing data —
        // `0 || '--'` used to render it as "Round --".
        document.getElementById('headerRound').textContent = formatRound(state, progress);

        // Update info panel
        updateInfoPanel(state, action);

        // Update play button state
        updatePlayButton();
    }

    function renderStandings(state) {
        const panel = document.getElementById('standingsPanel');
        if (!state?.teams?.length) {
            panel.innerHTML = '';
            return;
        }

        const sorted = [...state.teams].sort((a, b) => (b.points || 0) - (a.points || 0));
        panel.innerHTML = sorted.map((team, i) => `
            <div class="standings-row">
                <span class="standings-rank">#${i + 1}</span>
                <span class="standings-color" style="background:${teamHexColor(team.color) || '#888'}"></span>
                <span class="standings-name">${escapeHtml(team.name || 'Team ' + team.id)}</span>
                <span class="standings-points">${team.points || 0}pts</span>
                <span class="standings-record">${team.gamesWon || 0}W ${team.gamesLost || 0}L</span>
            </div>
        `).join('');
    }

    /**
     * Round 0 means pre-game setup. Entries logged before round 1 legitimately
     * carry roundNumber 0, so it must not be treated as "unknown".
     */
    function formatRound(state, progress) {
        const round = progress?.roundNumber
            ?? state?.currentPhase?.roundNumber
            ?? state?.currentRound;
        if (round === null || round === undefined) return 'Round --';
        return round === 0 ? 'Setup' : `Round ${round}`;
    }

    function updateInfoPanel(state, action) {
        // Only currentPhase.name is a real phase name. `action.phaseAtTime` used
        // to hold gameState.status ("playing"), which displayed as a phase; it is
        // now written correctly by action-logger.js, but the reconstructed state
        // is still the authoritative source here.
        const phaseName = state?.currentPhase?.name || '--';
        document.getElementById('infoPhase').innerHTML =
            `<span class="info-phase-badge">${escapeHtml(phaseName.replace(/_/g, ' '))}</span>`;

        const round = state?.currentPhase?.roundNumber ?? state?.currentRound;
        document.getElementById('infoRound').textContent =
            (round === null || round === undefined) ? '--' : (round === 0 ? 'Setup' : round);

        document.getElementById('infoGamesPlayed').textContent =
            state?.gamesPlayed || 0;

        // Derived by ReplayEngine._deriveEndStatus: "Finished" when the win
        // target was reached or the winner celebration was forced onto
        // view.html — and back to "Playing" if the admin then raised the
        // target, because the live game loop keeps going in that case.
        const status = state?.status || '--';
        document.getElementById('infoStatus').textContent =
            status === 'finished' ? 'Finished'
            : status === 'playing' ? 'Playing'
            : status === 'setup' ? 'Setup'
            : status;
    }

    // ===== Transport Controls =====
    function togglePlay() {
        if (!replayEngine) return;
        replayEngine.togglePlayback();
        updatePlayButton();
    }

    function updatePlayButton() {
        const btn = document.getElementById('playPauseBtn');
        if (replayEngine?.isPlaying) {
            btn.textContent = 'Pause';
            btn.classList.remove('paused');
        } else {
            btn.textContent = 'Play';
            btn.classList.add('paused');
        }
    }

    function stepFwd() { replayEngine?.stepForward(); }
    function stepBack() { replayEngine?.stepBackward(); }

    function seekStart() {
        if (replayEngine?.totalActions > 0) {
            replayEngine.seekToAction(replayEngine.minSequenceNumber);
        }
    }

    function seekEnd() {
        if (replayEngine?.totalActions > 0) {
            replayEngine.seekToAction(replayEngine.maxSequenceNumber);
        }
    }

    function seekToIndex(index) {
        if (!replayEngine) return;
        const action = replayEngine.getActionAtIndex(index);
        if (action) {
            replayEngine.seekToAction(action.sequenceNumber);
        }
    }

    function setSpeed(multiplier) {
        if (!replayEngine) return;
        replayEngine.setSpeed(multiplier);

        // Update button states
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.classList.toggle('active', parseInt(btn.dataset.speed) === multiplier);
        });
    }

    function jumpToRound(roundNumber) {
        if (!replayEngine || !roundNumber) return;
        replayEngine.seekToRound(parseInt(roundNumber));
        document.getElementById('roundJump').value = '';
    }

    // ===== Timeline Scrubbing =====
    function onTimelineScrub(value) {
        // Lightweight preview during drag — just update position text
        const total = replayEngine?.totalActions || 0;
        document.getElementById('timelinePosition').textContent =
            `${parseInt(value) + 1} / ${total}`;
    }

    function onTimelineSeek(value) {
        // Full state reconstruction on release
        const index = parseInt(value);
        const action = replayEngine?.getActionAtIndex(index);
        if (action) {
            replayEngine.seekToAction(action.sequenceNumber);
        }
    }

    // ===== Keyboard Shortcuts =====
    function onKeyDown(e) {
        // Don't capture when typing in inputs
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        switch (e.code) {
            case 'Space':
                e.preventDefault();
                togglePlay();
                break;
            case 'ArrowLeft':
                e.preventDefault();
                stepBack();
                break;
            case 'ArrowRight':
                e.preventDefault();
                stepFwd();
                break;
            case 'Home':
                e.preventDefault();
                seekStart();
                break;
            case 'End':
                e.preventDefault();
                seekEnd();
                break;
        }
    }

    // ===== Summary =====
    function openSummary() {
        if (!replayEngine) return;

        // Lazy-create SummaryGenerator
        if (!summaryGen) {
            summaryGen = new SummaryGenerator({
                actions: replayEngine.actions,
                backups: replayEngine.backups,
                finalState: replayEngine.tournamentDoc,
                boardModule: boardModule
            });
        }

        const modal = document.getElementById('summaryModal');
        const content = document.getElementById('summaryContent');

        summaryGen.renderHTML(content);
        modal.style.display = 'flex';
    }

    function closeSummary() {
        document.getElementById('summaryModal').style.display = 'none';
    }

    function exportSummaryJSON() {
        if (!summaryGen) return;
        const data = summaryGen.toJSON();
        downloadFile(JSON.stringify(data, null, 2),
            `summary-${tournamentId}-${Date.now()}.json`, 'application/json');
    }

    function exportSummaryMarkdown() {
        if (!summaryGen) return;
        const md = summaryGen.toMarkdown();
        downloadFile(md, `summary-${tournamentId}-${Date.now()}.md`, 'text/markdown');
    }

    // ===== Export =====
    function exportJSON() {
        if (actionExport) actionExport.exportJSON();
    }

    function exportCSV() {
        if (actionExport) actionExport.exportCSV();
    }

    // ===== Video Export =====
    // Records the full scrubbable replay to a downloadable .webm by driving
    // playback at speed while the browser's native tab/screen-share picker
    // feeds a MediaStream into MediaRecorder. Entirely client-side, no
    // Firestore writes. `videoExportState` is non-null only while an export
    // is in flight; every exit path (natural end, user-cancelled picker,
    // user-stopped-sharing mid-capture, manual Stop, recorder error) funnels
    // through finishVideoExport() so the UI/speed always get restored.
    let videoExportState = null;
    let videoExportStatusHideTimer = null; // pending fade-out timeout, so overlapping exports can't stray

    const VIDEO_EXPORT_SPEED = 5; // fast but still watchable default

    function scheduleVideoExportStatusHide(delayMs) {
        if (videoExportStatusHideTimer) clearTimeout(videoExportStatusHideTimer);
        videoExportStatusHideTimer = setTimeout(() => showVideoExportStatus(false), delayMs);
    }

    // If the admin navigates away or closes the tab mid-export, stop the
    // in-flight recorder and shared-screen tracks so nothing keeps running
    // (or leaking a live screen share) after the page is gone. Saving the
    // partial video isn't reliably possible on unload, so this is cleanup
    // only — no finalize/download attempt.
    function teardownVideoExportOnUnload() {
        if (!videoExportState?.active) return;
        try {
            const recorder = videoExportState.mediaRecorder;
            if (recorder && recorder.state !== 'inactive') recorder.stop();
        } catch (err) {
            console.warn('Error stopping recorder on unload:', err);
        }
        videoExportState.stream?.getTracks().forEach(t => t.stop());
        videoExportState.active = false;
    }
    window.addEventListener('beforeunload', teardownVideoExportOnUnload);
    window.addEventListener('pagehide', teardownVideoExportOnUnload);

    function pickVideoMimeType() {
        if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
        const candidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
        return candidates.find(type => MediaRecorder.isTypeSupported(type)) || '';
    }

    async function exportVideo() {
        if (!replayEngine || replayEngine.totalActions === 0) return;
        if (videoExportState?.active) return; // export already running

        if (!navigator.mediaDevices?.getDisplayMedia || !window.MediaRecorder) {
            setVideoExportText('Screen recording is not supported in this browser (missing screen capture or video recording support).');
            showVideoExportStatus(true);
            scheduleVideoExportStatusHide(4000);
            return;
        }

        // Stop any ongoing playback before the picker opens, and remember the
        // speed the user had selected so it can be restored afterwards.
        replayEngine.pause();
        updatePlayButton();
        const originalSpeed = replayEngine.speed;
        const originalAction = replayEngine.currentAction;
        const originalSequenceNumber = originalAction ? originalAction.sequenceNumber : replayEngine.minSequenceNumber;

        let stream;
        try {
            stream = await navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: 30 },
                audio: false
            });
        } catch (err) {
            // User cancelled the picker, or permission was denied — not a crash.
            console.warn('Screen share not granted:', err);
            setVideoExportText('Video export cancelled — screen sharing was not granted.');
            showVideoExportStatus(true);
            scheduleVideoExportStatusHide(3500);
            return;
        }

        const mimeType = pickVideoMimeType();
        let mediaRecorder;
        try {
            mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        } catch (err) {
            console.error('MediaRecorder init failed:', err);
            stream.getTracks().forEach(t => t.stop());
            setVideoExportText('Recording could not be started on this browser.');
            showVideoExportStatus(true);
            scheduleVideoExportStatusHide(4000);
            return;
        }

        const chunks = [];
        mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
            // Only stop the tracks once the recorder has actually flushed its
            // buffered data (onstop fired) — stopping them right after calling
            // .stop() risks tearing the stream down before it's fully done.
            videoExportState?.stream?.getTracks().forEach(t => t.stop());
            finalizeVideoExport(mimeType);
        };
        mediaRecorder.onerror = (e) => {
            console.error('MediaRecorder error:', e);
            if (videoExportState) videoExportState.stoppedReason = 'A recording error occurred.';
            finishVideoExport();
        };

        videoExportState = {
            mediaRecorder,
            stream,
            chunks,
            mimeType,
            originalSpeed,
            originalSequenceNumber,
            active: true,
            seenPlaying: false,       // becomes true once play() has actually started stepping
            startTime: Date.now(),
            pollTimer: null,
            stoppedReason: null
        };

        // If the admin stops sharing from the browser's own share-bar (not our
        // button), the shared track ends — capture what we have so far.
        const [videoTrack] = stream.getVideoTracks();
        videoTrack?.addEventListener('ended', () => {
            if (videoExportState?.active) {
                videoExportState.stoppedReason = 'Screen sharing was stopped.';
                finishVideoExport();
            }
        });

        const btn = document.getElementById('exportVideoBtn');
        btn.disabled = true;
        btn.textContent = 'Recording…';
        showVideoExportStatus(true);
        updateVideoExportProgress();

        // Rewind, switch to capture speed, start recorder, then start playback.
        seekStart();
        setSpeed(VIDEO_EXPORT_SPEED);
        mediaRecorder.start(1000);
        replayEngine.play();
        updatePlayButton();

        // play() is synchronous and isPlaying is already true right after the
        // call above, so we can't treat "isPlaying === true" as a signal on
        // its own. Instead we watch for the LATER transition true -> false,
        // which is what _scheduleNextStep()'s auto-pause-at-end produces
        // (verified in replay-engine.js: play()/pause()/_scheduleNextStep()).
        videoExportState.pollTimer = setInterval(() => {
            if (!videoExportState?.active) return;

            updateVideoExportProgress();

            if (replayEngine.isPlaying) {
                videoExportState.seenPlaying = true;
            } else if (videoExportState.seenPlaying) {
                finishVideoExport();
            }
        }, 250);
    }

    function updateVideoExportProgress() {
        if (!videoExportState || !replayEngine) return;
        const idx = replayEngine.currentIndex + 1;
        const total = replayEngine.totalActions;
        const elapsedSec = Math.round((Date.now() - videoExportState.startTime) / 1000);
        setVideoExportText(`Recording… action ${idx} / ${total} — ${elapsedSec}s elapsed`);
    }

    function setVideoExportText(text) {
        const el = document.getElementById('videoExportText');
        if (el) el.textContent = text;
    }

    function showVideoExportStatus(visible) {
        document.getElementById('videoExportStatus')?.classList.toggle('hidden', !visible);
    }

    /**
     * Single entry point for ending capture, from any trigger (natural end,
     * mid-capture cancellation, manual Stop, recorder error). Idempotent via
     * the `active` guard so overlapping triggers (e.g. poll + track 'ended'
     * firing close together) can't double-run this.
     */
    function finishVideoExport() {
        if (!videoExportState?.active) return;
        videoExportState.active = false;

        if (videoExportState.pollTimer) {
            clearInterval(videoExportState.pollTimer);
            videoExportState.pollTimer = null;
        }

        replayEngine?.pause();
        updatePlayButton();

        const recorder = videoExportState.mediaRecorder;
        if (recorder && recorder.state !== 'inactive') {
            // Tracks are stopped inside onstop, once the recorder has fully
            // flushed its buffered data (see onstop handler above).
            recorder.stop(); // -> onstop -> finalizeVideoExport()
        } else {
            // Recorder never got going — no onstop will fire, so stop the
            // tracks and finalize directly instead of waiting forever.
            videoExportState.stream?.getTracks().forEach(t => t.stop());
            finalizeVideoExport(videoExportState.mimeType);
        }
    }

    function cancelVideoExport() {
        if (!videoExportState?.active) return;
        videoExportState.stoppedReason = 'Export stopped by user.';
        finishVideoExport();
    }

    /**
     * Assembles the recorded chunks into a Blob and triggers the download,
     * then restores the page to a normal (non-fast-forwarded) state:
     * re-enable the button, restore the speed the user had before export,
     * and fade out the status line.
     */
    function finalizeVideoExport(mimeType) {
        const chunks = videoExportState?.chunks || [];
        const reason = videoExportState?.stoppedReason;

        if (chunks.length > 0) {
            const blob = new Blob(chunks, { type: mimeType || 'video/webm' });
            const safeName = (replayEngine?.tournamentName || tournamentId || 'tournament')
                .replace(/[^a-z0-9_-]+/gi, '_');
            const filename = `replay-${safeName}-${tournamentId}-${Date.now()}.webm`;
            downloadFile(blob, filename, mimeType || 'video/webm');
            setVideoExportText(reason ? `${reason} Partial video downloaded.` : 'Video export complete — download started.');
        } else {
            setVideoExportText(reason || 'Recording produced no video data.');
        }

        const btn = document.getElementById('exportVideoBtn');
        if (btn) {
            btn.disabled = false;
            btn.textContent = 'Export Video';
        }

        // Restore the speed and scrub position the user had before export
        // started, and leave playback paused rather than mid-fast-forward.
        if (replayEngine) {
            setSpeed(videoExportState?.originalSpeed || 1);
            if (videoExportState?.originalSequenceNumber !== undefined) {
                replayEngine.seekToAction(videoExportState.originalSequenceNumber);
            }
        }

        scheduleVideoExportStatusHide(4000);

        videoExportState = null;
    }

    // ===== Utilities =====
    function formatTimestamp(ts) {
        if (!ts) return '';
        const date = ts.toDate ? ts.toDate() : new Date(ts);
        if (isNaN(date.getTime())) return '';
        return date.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function showError(title, message) {
        document.getElementById('loadingOverlay').classList.add('hidden');
        document.getElementById('errorTitle').textContent = title;
        document.getElementById('errorMessage').textContent = message;
        document.getElementById('errorOverlay').classList.remove('hidden');
    }

    function downloadFile(content, filename, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
