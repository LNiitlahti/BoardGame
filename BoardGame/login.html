<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Game - Login</title>

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="shared/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="shared/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="shared/images/favicon/favicon-16x16.png">
  <link rel="manifest" href="shared/images/favicon/site.webmanifest">
  <link rel="shortcut icon" href="shared/images/favicon/favicon.ico">

  <!-- Fonts & Theme -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Quantico:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/css/auth-modern.css">

  <script>window.BOARDGAME_BASE = '.';</script>
  <script src="shared/scripts/firebase-loader.js"></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <!-- Logo Section -->
    <div class="auth-logo-section">
      <img class="auth-logo" src="shared/images/favicon/android-chrome-512x512.png" alt="Board Game logo">
      <h1 class="auth-logo-title">Board Game</h1>
      <p class="auth-logo-subtitle">Tournament Management System</p>
    </div>

    <!-- Status Message -->
    <div id="statusMessage" class="auth-status-message"></div>

    <!-- Login Form -->
    <div id="loginSection" class="auth-card">
      <h2 class="auth-card-title">Welcome Back</h2>
      <p class="auth-card-description">Sign in to continue to your tournament</p>

      <form id="loginForm" class="auth-form">
        <div class="auth-form-group">
          <label for="loginEmail" class="auth-form-label">Email</label>
          <input
            type="email"
            id="loginEmail"
            class="auth-form-input"
            placeholder="your@email.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="auth-form-group">
          <label for="loginPassword" class="auth-form-label">Password</label>
          <input
            type="password"
            id="loginPassword"
            class="auth-form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="auth-btn auth-btn-primary" id="loginBtn">
          Sign In
        </button>
      </form>

      <div class="auth-toggle">
        Don't have an account?
        <a class="auth-toggle-link" onclick="showRegister()">Register here</a>
      </div>
    </div>

    <!-- Registration Form -->
    <div id="registerSection" class="auth-card" style="display: none;">
      <h2 class="auth-card-title">Create Account</h2>
      <p class="auth-card-description">Register with a referral code to join</p>

      <form id="registerForm" class="auth-form">
        <div class="auth-form-group">
          <label for="firstName" class="auth-form-label">First Name</label>
          <input
            type="text"
            id="firstName"
            class="auth-form-input"
            placeholder="Your first name"
            required
            autocomplete="given-name"
          >
        </div>

        <div class="auth-form-group">
          <label for="lastName" class="auth-form-label">Last Name</label>
          <input
            type="text"
            id="lastName"
            class="auth-form-input"
            placeholder="Your last name"
            required
            autocomplete="family-name"
          >
        </div>

        <div class="auth-form-group">
          <label for="registerEmail" class="auth-form-label">Email</label>
          <input
            type="email"
            id="registerEmail"
            class="auth-form-input"
            placeholder="your@email.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="auth-form-group">
          <label for="registerPassword" class="auth-form-label">Password</label>
          <input
            type="password"
            id="registerPassword"
            class="auth-form-input"
            placeholder="Choose a strong password"
            required
            autocomplete="new-password"
          >
        </div>

        <div class="auth-form-group">
          <label for="referralCode" class="auth-form-label">Referral Code</label>
          <input
            type="text"
            id="referralCode"
            class="auth-form-input"
            placeholder="Enter your referral code"
            required
          >
        </div>

        <button type="submit" class="auth-btn auth-btn-secondary" id="registerBtn">
          Create Account
        </button>
      </form>

      <div class="auth-toggle">
        Already have an account?
        <a class="auth-toggle-link" onclick="showLogin()">Sign in here</a>
      </div>
    </div>
  </div>

  <script>
    let auth;
    let db;

    // Wait for Firebase to be ready
    document.addEventListener('firebase-ready', function() {
      console.log("Firebase ready, setting up auth...");

      auth = firebase.auth();
      db = firebase.firestore();

      // Monitor auth state — ignore anonymous users (firebase-loader signs in anonymously)
      auth.onAuthStateChanged(user => {
        if (user && !user.isAnonymous) {
          console.log("User logged in:", user.uid);
          showStatus('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        }
      });

      // Login form submission
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        handleLogin();
      });

      // Register form submission
      document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        handleRegister();
      });
    });

    function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        showStatus('Please enter both email and password', 'error');
        return;
      }

      // Show loading state
      btn.classList.add('loading');
      btn.disabled = true;

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          showStatus('Login successful!', 'success');
        })
        .catch(err => {
          console.error('Login error:', err);
          btn.classList.remove('loading');
          btn.disabled = false;

          let message = 'Login failed. Please try again.';
          if (err.code === 'auth/user-not-found') {
            message = 'No account found with this email.';
          } else if (err.code === 'auth/wrong-password') {
            message = 'Incorrect password.';
          } else if (err.code === 'auth/invalid-email') {
            message = 'Invalid email address.';
          }

          showStatus(message, 'error');
        });
    }

    function handleRegister() {
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;
      const code = document.getElementById('referralCode').value.trim();
      const btn = document.getElementById('registerBtn');

      if (!firstName || !lastName || !email || !password || !code) {
        showStatus('Please fill in all fields', 'error');
        return;
      }

      if (password.length < 6) {
        showStatus('Password must be at least 6 characters', 'error');
        return;
      }

      // Show loading state
      btn.classList.add('loading');
      btn.disabled = true;

      let userId;

      // Check if referral code exists and is unused
      db.collection("referralCodes").doc(code).get().then(doc => {
        if (!doc.exists) {
          throw new Error('Invalid referral code');
        }
        if (doc.data().used) {
          throw new Error('This referral code has already been used');
        }

        // Create the user
        return auth.createUserWithEmailAndPassword(email, password);
      })
      .then(cred => {
        userId = cred.user.uid;

        // Create user document in Firestore
        return db.collection("users").doc(userId).set({
          uid: userId,
          email: email,
          firstName: firstName,
          lastName: lastName,
          displayName: firstName,  // Use first name as display name (player name)
          fullName: `${firstName} ${lastName}`,

          // Role flags (default: no special roles)
          isAdmin: false,
          isSuperAdmin: false,
          isGod: false,

          // Appointment fields (null until admin assigns)
          assignedGameId: null,
          assignedTeamId: null,
          assignedTeamName: null,
          appointedAt: null,
          appointedBy: null,

          // Metadata
          createdAt: new Date().toISOString(),
          lastLogin: new Date().toISOString(),
          referralCode: code
        });
      })
      .then(() => {
        // Mark referral code as used
        return db.collection("referralCodes").doc(code).set({
          used: true,
          assignedTo: userId,
          assignedEmail: email,
          assignedName: `${firstName} ${lastName}`,
          usedAt: new Date().toISOString()
        }, { merge: true });
      })
      .then(() => {
        showStatus('Registration successful! Redirecting...', 'success');
      })
      .catch(err => {
        console.error('Registration error:', err);
        btn.classList.remove('loading');
        btn.disabled = false;

        let message = err.message || 'Registration failed. Please try again.';
        if (err.code === 'auth/email-already-in-use') {
          message = 'An account with this email already exists.';
        } else if (err.code === 'auth/invalid-email') {
          message = 'Invalid email address.';
        } else if (err.code === 'auth/weak-password') {
          message = 'Password is too weak. Use at least 6 characters.';
        }

        showStatus(message, 'error');
      });
    }

    function showLogin() {
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('registerSection').style.display = 'none';
      hideStatus();
    }

    function showRegister() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('registerSection').style.display = 'block';
      hideStatus();
    }

    function showStatus(message, type) {
      const statusEl = document.getElementById('statusMessage');
      statusEl.textContent = message;
      statusEl.className = `auth-status-message ${type}`;
      statusEl.style.display = 'block';

      // Auto-hide after 5 seconds for errors
      if (type === 'error') {
        setTimeout(() => {
          hideStatus();
        }, 5000);
      }
    }

    function hideStatus() {
      const statusEl = document.getElementById('statusMessage');
      statusEl.style.display = 'none';
    }
  </script>
</body>
</html>
